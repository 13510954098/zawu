name: Verify Flutter Source Zip

on:
  push:
    branches:
      - "arena/f32564a0-zawu"

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip, Analyze, Test & Build APK
        run: |
          set -e
          unzip -q lanerc-source.zip -d /tmp/verify
          cd /tmp/verify/lanerc-source
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --debug
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
