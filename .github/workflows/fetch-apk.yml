name: Fetch Sample Artifact

on:
  push:
    branches:
      - arena/f32564a0-zawu
    paths:
      - .github/workflows/fetch-apk.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        env:
          TARGET_URL: "https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTYxOTIzMzQzOTpNRVJDSEFOVDpbQkAyZjc1Mjg0ZDoyMjUzNTM1MjMyOTQzOQ%3D%3D.apk"
        run: |
          mkdir -p out
          if command -v aria2c >/dev/null 2>&1; then
            aria2c -x 16 -s 16 -k 1M --file-allocation=none -d out -o sample.apk "$TARGET_URL"
          else
            curl -fSL --retry 3 -o out/sample.apk "$TARGET_URL"
          fi
          ls -lh out/sample.apk
          sha256sum out/sample.apk
          file out/sample.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-apk
          path: out/sample.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
