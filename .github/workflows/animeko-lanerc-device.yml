name: Animeko Lanerc Android KeyStore device tests
on:
  push:
    branches: [arena/44f5d2ee-zawu]
    paths: [integration/animeko/overlay/app/shared/app-data/src/androidDeviceTest/**, .github/workflows/animeko-lanerc-device.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: animeko-lanerc-android-vault-tests
  cancel-in-progress: false
jobs:
  vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare pinned host and emulator KVM access
        run: |
          python scripts/prepare_animeko_lanerc.py
          cat >> .local/animeko/worktree/local.properties <<'EOF'
          ani.enable.firebase=false
          ani.enable.ios=false
          ani.android.abis=x86_64
          jvm.toolchain.version=21
          jvm.toolchain.vendor=Eclipse Adoptium
          EOF
          sudo chmod 666 /dev/kvm
          cat > /tmp/lanerc-vault-test.sh <<'EOF'
          #!/bin/bash
          cd "$GITHUB_WORKSPACE/.local/animeko/worktree" || exit 1
          bash gradlew :app:shared:app-data:connectedDeviceTest -Pandroid.min.sdk=30 -Pandroid.testInstrumentationRunnerArguments.class=me.him188.ani.app.domain.mediasource.lanerc.runtime.LanercVaultDeviceTest --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g > /tmp/lanerc-vault-test.log 2>&1
          status=$?
          tail -100 /tmp/lanerc-vault-test.log
          exit "$status"
          EOF
      - name: Test real Android KeyStore provider on API 30 emulator
        id: tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -camera-front none -memory 1536
          script: bash /tmp/lanerc-vault-test.sh
      - name: Require exactly three executed KeyStore tests
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          roots = [ET.parse(p).getroot() for p in pathlib.Path('.local/animeko/worktree/app/shared/app-data/build/outputs').rglob('TEST-*.xml') if 'LanercVaultDeviceTest' in p.read_text(errors='replace')]
          assert sum(int(r.attrib.get('tests', 0)) for r in roots) == 4, 'Expected four executed Android KeyStore tests'
          assert all(int(r.attrib.get(k, 0)) == 0 for r in roots for k in ['failures','errors','skipped'])
          PY
      - name: Preserve actual device test scope and diagnostics
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          roots = [ET.parse(p).getroot() for p in pathlib.Path('.local/animeko/worktree/app/shared/app-data/build/outputs').rglob('TEST-*.xml') if 'LanercVaultDeviceTest' in p.read_text(errors='replace')]
          counts = {k:sum(int(r.attrib.get(k, 0)) for r in roots) for k in ['tests','failures','errors','skipped']}
          report = {'scope':'Actual Android KeyStore AES-GCM on API 30 x86_64 emulator with public synthetic data; not hardware device or production playback', 'source_commit':os.environ['GITHUB_SHA'], 'step_outcome':os.environ.get('TEST_OUTCOME'), **counts}
          pathlib.Path('analysis/lanerc/animeko-vault-device-validation.json').write_text(json.dumps(report, indent=2)+'\n')
          log = pathlib.Path('/tmp/lanerc-vault-test.log')
          if log.exists(): pathlib.Path('analysis/lanerc/animeko-vault-device-diagnostic.txt').write_text('\n'.join(log.read_text(errors='replace').splitlines()[-180:])+'\n')
          PY
          git switch -C arena/44f5d2ee-zawu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/lanerc/animeko-vault-device-*.json
          if test -f analysis/lanerc/animeko-vault-device-diagnostic.txt; then git add analysis/lanerc/animeko-vault-device-diagnostic.txt; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Record actual Android emulator KeyStore test outcome'
          git pull --rebase -X theirs origin arena/44f5d2ee-zawu
          git push origin HEAD:arena/44f5d2ee-zawu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animeko-lanerc-android-vault-device-results
          path: .local/animeko/worktree/app/shared/app-data/build/outputs/androidTest-results/
          if-no-files-found: warn
