name: Lanerc AOT metadata analysis
on:
  workflow_dispatch:
  push:
    branches: [arena/44f5d2ee-zawu]
    paths:
      - .github/workflows/lanerc-aot.yml
      - scripts/lanerc_aot_summary.py
      - scripts/lanerc_pool_anchors.py
      - scripts/lanerc_analyzer_patch.py
      - scripts/lanerc_apk_material_layout.py
      - scripts/lanerc_generate_builtin.py
      - scripts/lanerc_guest_flow.py
      - scripts/lanerc_recover_material.py
      - tests/test_lanerc_builtin.py
      - analysis/lanerc/analysis-recipient.pem
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/44f5d2ee-zawu
      - name: Test layout probe against public synthetic arrays on Actions
        run: |
          python3 - <<'PY'
          from scripts.lanerc_apk_material_layout import probe, joint_reference_layout
          chunks = [list(range(16)), list(reversed(range(16))), [(v*3)%16 for v in range(16)], [(v*5)%16 for v in range(16)]]
          pool = '[pp+0xe238] ' + ' '.join('List<int>(16) [' + ','.join(map(str, chunk)) + ']' for chunk in chunks)
          binary = b'\xff'*8 + b'\xff'.join(bytes(chunk) for chunk in chunks) + b'\xff'*8
          result = probe(binary, pool)
          assert result['all_arrays_uniquely_located']
          assert all(any(m['offset'] == 8 + 17*i and m['stride'] == 1 and m['bias'] == 0 and m['width'] == 1 for m in row['matches']) for i, row in enumerate(result['arrays']))
          try:
              probe(binary, '[pp+0xe238] List<int>(16) [16]')
          except ValueError:
              pass
          else:
              raise AssertionError('Malformed material structure was not rejected')
          references = [(v*v + 3*v + 17) % 251 for v in range(16)]
          indirect = b'\xff'*8 + b'\xff'.join(bytes(references[v] for v in chunk) for chunk in chunks) + b'\xff'*8
          result = probe(indirect, pool)
          assert not result['all_arrays_uniquely_located'], 'Reference structure is not a recovered key mapping'
          assert all(any(candidate['width'] == 1 and 8 + 17*i in candidate['offsets'] for candidate in row['reference_structure_candidates']) for i, row in enumerate(result['arrays']))
          words = [bytes([v + 128]) if v % 2 else bytes([v, 128]) for v in range(16)]
          variable = b'\xff'*8 + b''.join(words[v] for v in chunks[0]) + b'\xff'*8
          result = probe(variable, pool)
          assert any(candidate['width'] == 'dart-variable-reference' and 8 in candidate['offsets'] for candidate in result['arrays'][0]['reference_structure_candidates'])
          full = b'\xff'*8
          records = []
          for chunk in chunks:
              records.append({'reference_structure_candidates':[{'width':'dart-variable-reference', 'offsets':[len(full)], 'truncated':False}]})
              full += b''.join(words[v] for v in chunk)
          joint = joint_reference_layout(full, chunks, records)
          assert joint['unique'] and joint['mapped_nibble_count'] == 16
          print('Synthetic literal, variable and joint reference checks passed; no real values printed')
          PY
      - name: Verify client material excludes account and guest credentials
        run: python3 -m unittest discover -s tests -p test_lanerc_builtin.py -v
      - name: Prepare verified APK libraries
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('downloads/lanerc')
          data = b''.join(p.read_bytes() for p in sorted(root.glob('*.apk.part*')))
          expected = json.loads((root / 'download-report.json').read_text())['downloads'][0]
          assert len(data) == expected['size']
          assert hashlib.sha256(data).hexdigest() == expected['sha256']
          apk = pathlib.Path('/tmp/lanerc.apk')
          apk.write_bytes(data)
          with zipfile.ZipFile(apk) as z:
              for name in ['libapp.so', 'libflutter.so']:
                  out = pathlib.Path('/tmp/lanerc-libs') / name
                  out.parent.mkdir(exist_ok=True)
                  out.write_bytes(z.read('lib/arm64-v8a/' + name))
          PY
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-13 cmake ninja-build pkg-config libicu-dev libcapstone-dev python3-venv
          python3 -m venv /tmp/aot-env
          /tmp/aot-env/bin/pip install pyelftools requests capstone
      - name: Restore pinned analyzer build cache
        uses: actions/cache@v4
        with:
          path: /tmp/blutter
          key: lanerc-blutter-ubuntu24-dart392-4a60ac6-v1
      - name: Build pinned analyzer and analyze locally on runner
        id: analysis
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          if [ ! -d /tmp/blutter/.git ]; then git clone https://github.com/worawit/blutter.git /tmp/blutter; fi
          git -C /tmp/blutter checkout 4a60ac648bf448c5a7596437243bcd0b9376fdf0
          git -C /tmp/blutter restore blutter/src/DartField.cpp blutter/src/DartFnBase.h
          python3 scripts/lanerc_analyzer_patch.py /tmp/blutter
          # Raw output stays in ephemeral runner storage, never in public logs/artifacts.
          if /tmp/aot-env/bin/python /tmp/blutter/blutter.py /tmp/lanerc-libs /tmp/lanerc-aot --rebuild > /tmp/aot-build.log 2>&1; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Export redacted graph or build failure status
        env:
          ANALYSIS_RESULT: ${{ steps.analysis.outputs.result }}
        run: |
          mkdir -p analysis/lanerc
          if [ "$ANALYSIS_RESULT" = success ]; then
            python3 scripts/lanerc_aot_summary.py /tmp/lanerc-aot/asm analysis/lanerc/aot-callgraph.json
            /tmp/aot-env/bin/python scripts/lanerc_pool_anchors.py /tmp/lanerc-libs/libapp.so /tmp/lanerc-aot/pp.txt analysis/lanerc/aot-callgraph.json analysis/lanerc/pool-anchors.json
          fi
          python3 - <<'PY'
          import json, os, pathlib, re
          result = os.environ['ANALYSIS_RESULT']
          log = pathlib.Path('/tmp/aot-build.log').read_text(errors='replace')
          # Only fixed error classifications, not raw log lines or object values.
          categories = [label for pattern, label in [
              ('out of memory|Killed signal', 'compiler-memory-limit'),
              ('snapshot.*(mismatch|incompat)|Wrong.*snapshot', 'snapshot-compatibility'),
              ('fatal error:', 'compiler-fatal-error'),
              ('Assertion.*failed', 'analyzer-assertion'),
              ('HTTPError|ConnectionError|Could not resolve', 'dependency-network-error'),
              ('FAILED:', 'build-command-failed'),
          ] if re.search(pattern, log, re.I)]
          pathlib.Path('analysis/lanerc/aot-status.json').write_text(json.dumps({
              'result': result, 'run_id': os.environ['GITHUB_RUN_ID'],
              'analyzer_commit': '4a60ac648bf448c5a7596437243bcd0b9376fdf0',
              'dart_version_observed': '3.9.2', 'error_categories': categories,
              'raw_outputs': 'Not published: ephemeral runner files only',
              'output_files': {str(p.relative_to('/tmp/lanerc-aot')): p.stat().st_size for p in pathlib.Path('/tmp/lanerc-aot').glob('*') if p.is_file()},
              'diagnostic_flags': {label: bool(re.search(pattern, log, re.I)) for pattern, label in [
                  ('exception:', 'exception-reported'), ('Analyzing the application', 'analysis-started'),
                  ('Generating application assemblies', 'assembly-generation-reached'),
                  ('Failed to', 'failure-message-present'),
              ]},
          }, indent=2))
          PY
      - name: Investigate direct APK import layout without publishing material
        if: steps.analysis.outputs.result == 'success'
        run: |
          python3 scripts/lanerc_apk_material_layout.py /tmp/lanerc-libs/libapp.so /tmp/lanerc-aot/pp.txt analysis/lanerc/apk-material-layout.json
      - name: Inspect native guest/authenticated play control flow without pool literals
        if: steps.analysis.outputs.result == 'success'
        run: |
          /tmp/aot-env/bin/python scripts/lanerc_guest_flow.py /tmp/lanerc-libs/libapp.so analysis/lanerc/pool-anchors.json analysis/lanerc/native-guest-flow.json
      - name: Generate bundled client protocol constants, never user credentials
        if: steps.analysis.outputs.result == 'success'
        run: |
          python3 scripts/lanerc_generate_builtin.py /tmp/lanerc-aot/pp.txt integration/animeko/overlay/app/shared/app-data/src/commonMain/kotlin/domain/mediasource/lanerc/core/LanercBuiltInMaterial.kt
      - name: Encrypt raw analysis archive (no local analysis required)
        if: steps.analysis.outputs.result == 'success'
        run: |
          tar -czf /tmp/lanerc-analysis.tar.gz -C /tmp/lanerc-aot pp.txt objs.txt asm
          test "$(stat -c%s /tmp/lanerc-analysis.tar.gz)" -le 5242880
          openssl cms -encrypt -binary -aes-256-cbc \
            -in /tmp/lanerc-analysis.tar.gz -outform DER \
            -out analysis/lanerc/private-bundle.p7m analysis/lanerc/session-recipient.pem
      - name: Commit metadata and encrypted bundle to session branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/lanerc/
          if test -f integration/animeko/overlay/app/shared/app-data/src/commonMain/kotlin/domain/mediasource/lanerc/core/LanercBuiltInMaterial.kt; then
            git add integration/animeko/overlay/app/shared/app-data/src/commonMain/kotlin/domain/mediasource/lanerc/core/LanercBuiltInMaterial.kt
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record redacted Lanerc AOT analysis metadata"
          git pull --rebase -X theirs origin arena/44f5d2ee-zawu
          git push origin HEAD:arena/44f5d2ee-zawu
