name: Inspect public Lanerc source configuration
on:
  push:
    branches: [arena/44f5d2ee-zawu]
    paths: [.github/workflows/lanerc-source-config.yml, scripts/lanerc_public_source_config.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/44f5d2ee-zawu
      - name: Fetch public configuration without credentials or redirects
        run: |
          python scripts/lanerc_public_source_config.py --output analysis/lanerc/public-source-config.json --private-output /tmp/source-config.json
          openssl cms -encrypt -binary -aes-256-cbc -in /tmp/source-config.json -outform DER -out analysis/lanerc/public-source-config.p7m analysis/lanerc/analysis-recipient.pem
      - name: Save redacted evidence and encrypted responses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/lanerc/public-source-config.json analysis/lanerc/public-source-config.p7m
          git diff --cached --quiet && exit 0
          git commit -m 'Record public fallback source configuration evidence'
          git push origin HEAD:arena/44f5d2ee-zawu
