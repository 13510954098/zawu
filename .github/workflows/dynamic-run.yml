name: Dynamic Emulator Observation

on:
  push:
    branches:
      - arena/f32564a0-zawu
    paths:
      - .github/workflows/dynamic-run.yml
      - .github/scripts/run_dynamic_obs.py

permissions:
  contents: write

jobs:
  dynamic-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM and Prepare Workspace
        run: |
          set -euo pipefail
          mkdir -p work/report
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          which tcpdump || (sudo apt-get update && sudo apt-get install -y tcpdump)

      - name: Fetch APK
        env:
          TARGET_URL: "https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTYxOTIzMzQzOTpNRVJDSEFOVDpbQkAyZjc1Mjg0ZDoyMjUzNTM1MjMyOTQzOQ%3D%3D.apk"
          EXPECTED_SHA256: "4368de63ae2003138dbe63b673422a3b3a5414ab652ffb1feb3424964f88bcfd"
        run: |
          set -euo pipefail
          if aria2c -x 16 -s 16 -k 1M --file-allocation=none -d work -o sample.apk "$TARGET_URL"; then
            echo "Downloaded via aria2c"
          else
            echo "Fallback to Git Blobs..."
            python3 - <<'PY'
            import os, pathlib, subprocess
            repo = os.environ["REPO"]
            shas = [
                "e14dbcd56ff3a8964ca8278a2430c23a552eb0c8",
                "caf54a55b501c8999cbd8c92ff811160c3d6abdd",
                "c2ca226826e4222e91b7ec1750310fb547003d10",
                "151a41f5c6c7312244c29da12a8574444d834e16",
                "d7841db871386791951ec85c7a6ffde8a123326d",
                "4f3b71e659f28740a3e71cc5f78a603851b23bb4",
            ]
            with open("work/sample.apk", "wb") as f:
                for s in shas:
                    f.write(subprocess.check_output([
                        "gh", "api", "-H", "Accept: application/vnd.github.raw+json",
                        f"repos/{repo}/git/blobs/{s}",
                    ]))
            PY
          fi
          ACTUAL=$(sha256sum work/sample.apk | awk '{print $1}')
          echo "APK sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_SHA256"

      - name: Setup Android SDK Image and Boot Headless KVM Emulator
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/emulator:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager --install "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64" >/dev/null

          echo "no" | avdmanager create avd --force \
            --name test_avd \
            --package "system-images;android-30;google_apis;x86_64" \
            --tag "google_apis" \
            --abi "x86_64" \
            --device "pixel_4"

          nohup "$SDK_ROOT/emulator/emulator" \
            -avd test_avd \
            -no-window \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -partition-size 6144 \
            -memory 4096 > work/emulator.log 2>&1 &
          EMU_PID=$!

          adb wait-for-device
          BOOT=""
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOT" = "1" ]; then
              echo "Emulator booted in $((i*2))s"
              break
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Emulator exited prematurely"
              tail -n 150 work/emulator.log > work/failure_diag.txt
              exit 1
            fi
            sleep 2
          done
          if [ "$BOOT" != "1" ]; then
            echo "Emulator boot timed out"
            tail -n 150 work/emulator.log > work/failure_diag.txt
            exit 1
          fi
          sleep 6

      - name: Run Black-Box Dynamic Observation
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$SDK_ROOT/emulator:$SDK_ROOT/platform-tools:$PATH"
          python3 .github/scripts/run_dynamic_obs.py

      - name: Report Failure Diagnostics if Any
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          diag = []
          for p in ("work/failure_diag.txt", "work/emulator.log"):
              fp = pathlib.Path(p)
              if fp.exists():
                  diag.append(f"=== {p} ===\n" + fp.read_text(errors="replace")[-3500:])
          body = json.dumps({"type": "failure_diag", "logs": "\n".join(diag)[-6000:]})
          payload = pathlib.Path("work/err_comment.json")
          payload.write_text(json.dumps({"body": body}))
          subprocess.run([
              "gh", "api",
              f"repos/{os.environ['REPO']}/commits/{os.environ['COMMIT_SHA']}/comments",
              "--method", "POST", "--input", str(payload)
          ], check=False)
          PY

      - name: Shutdown Emulator
        if: always()
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/platform-tools/adb" emu kill || true
