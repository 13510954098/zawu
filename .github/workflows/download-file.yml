name: Download and Release (Multi-threaded)

on:
  workflow_dispatch:
    inputs:
      url:
        description: '下载地址'
        required: true
        type: string
      filename:
        description: '保存的文件名（留空则自动从 URL 提取）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Resolve filename
        id: resolve
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.filename }}
        run: |
          if [ -z "$INPUT_NAME" ]; then
            INPUT_NAME=$(basename "${INPUT_URL%%\?*}")
          fi
          if [ -z "$INPUT_NAME" ] || [ "$INPUT_NAME" = "/" ]; then
            INPUT_NAME="download.bin"
          fi
          echo "filename=$INPUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download with aria2 (multi-threaded)
        env:
          DL_URL: ${{ inputs.url }}
          DL_NAME: ${{ steps.resolve.outputs.filename }}
        run: |
          # -x 16: 每个服务器最多 16 个连接
          # -s 16: 将文件分成 16 个片段同时下载
          # -k 1M: 每个片段最小 1MB
          aria2c -x 16 -s 16 -k 1M --file-allocation=none -o "$DL_NAME" "$DL_URL"

      - name: Verify file
        env:
          DL_NAME: ${{ steps.resolve.outputs.filename }}
        run: ls -lh "$DL_NAME"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_number }}
          name: "自动下载 - ${{ steps.resolve.outputs.filename }}"
          body: |
            自动下载自：${{ inputs.url }}
            运行编号：${{ github.run_number }}
          files: ${{ steps.resolve.outputs.filename }}
          token: ${{ secrets.GITHUB_TOKEN }}
