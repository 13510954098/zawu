name: Download File

on:
  workflow_dispatch:
    inputs:
      url:
        description: '下载地址'
        required: true
        type: string
      filename:
        description: '保存的文件名（留空则自动从 URL 提取）'
        required: false
        default: ''
        type: string

# 关键：默认 token 是只读的，必须显式授予写权限，否则 git push 会 403
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史，避免浅克隆导致的推送问题
          fetch-depth: 0

      - name: Resolve filename
        id: resolve
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.filename }}
        run: |
          if [ -z "$INPUT_NAME" ]; then
            # 去掉 query 参数后取最后一段作为文件名
            INPUT_NAME=$(basename "${INPUT_URL%%\?*}")
          fi

          # 兜底：如果还拿不到名字就默认 download.bin
          if [ -z "$INPUT_NAME" ] || [ "$INPUT_NAME" = "/" ]; then
            INPUT_NAME="download.bin"
          fi

          echo "filename=$INPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "解析出的文件名: $INPUT_NAME"

      - name: Download file
        env:
          DL_URL: ${{ inputs.url }}
          DL_NAME: ${{ steps.resolve.outputs.filename }}
        run: |
          curl -L --fail \
            --connect-timeout 30 \
            --max-time 1800 \
            --retry 3 \
            --retry-delay 5 \
            -o "$DL_NAME" \
            "$DL_URL"

      - name: Verify file
        env:
          DL_NAME: ${{ steps.resolve.outputs.filename }}
        run: |
          ls -lh "$DL_NAME"
          file "$DL_NAME"
          # 检查是否超过 GitHub 单文件 100MB 限制
          SIZE=$(stat -c%s "$DL_NAME")
          if [ "$SIZE" -gt 104857600 ]; then
            echo "::error::文件大小 $SIZE 字节，超过 GitHub 100MB 限制，无法推送到仓库"
            exit 1
          fi
          echo "文件大小检查通过：$SIZE 字节"

      - name: Commit and push
        env:
          DL_NAME: ${{ steps.resolve.outputs.filename }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -f 强制添加，跳过 .gitignore 的排除规则
          git add -f "$DL_NAME"

          # 没有变化就跳过，避免 "nothing to commit" 导致失败
          if git diff --cached --quiet; then
            echo "文件无变化，跳过提交"
            exit 0
          fi

          git commit -m "Add $DL_NAME (auto-downloaded)"
          git push

      - name: Upload as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ steps.resolve.outputs.filename }}
          if-no-files-found: warn
