name: Build local Android recorder
on:
  workflow_dispatch:
  push:
    branches: ['arena/6d46a18e-zawu']
    paths: ['recorder/**', '.github/workflows/build-recorder.yml']
permissions:
  contents: read
jobs:
  debug-apk:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint
        working-directory: recorder
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:lintDebug 2>&1 | tee build.log || { echo "::error::$(tail -50 build.log | tr '\n' '|')"; exit 1; }
      - name: Package APK and checksum
        run: |
          mkdir -p delivery
          cp recorder/app/build/outputs/apk/debug/app-debug.apk delivery/lanerc-local-recorder-debug.apk
          cd delivery
          sha256sum lanerc-local-recorder-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lanerc-local-recorder-debug
          path: delivery/
      - name: Publish installable APK on this session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery/lanerc-local-recorder-debug.apk delivery/SHA256SUMS.txt
          git commit -m "Publish built debug APK and SHA-256" || exit 0
          git push origin HEAD:arena/6d46a18e-zawu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: recorder/app/build/reports/lint-results-debug.*
  android11-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build instrumentation
        working-directory: recorder
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee test-build.log || { echo "::error::$(tail -50 test-build.log | tr '\n' '|')"; exit 1; }
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install recorder/app/build/outputs/apk/debug/app-debug.apk
            adb install recorder/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w local.lanerc.recorder.test/local.lanerc.recorder.SmokeInstrumentation | tee emulator-results.txt
            grep -q 'PASS: Android 11' emulator-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android11-smoke-results
          path: emulator-results.txt
