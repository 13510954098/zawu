name: Verify Qishui Source Zip

on:
  push:
    branches:
      - "arena/f32564a0-zawu"

permissions:
  contents: write

jobs:
  verify-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Unzip & Run Full Flutter Build + Analyze + Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/verify_work
          unzip -q qishui-source.zip -d /tmp/verify_work
          cd /tmp/verify_work/qishui-source

          flutter pub get > /tmp/pub.log 2>&1
          RC_PUB=$?
          flutter analyze > /tmp/ana.log 2>&1
          RC_ANA=$?
          flutter test > /tmp/tst.log 2>&1
          RC_TST=$?
          flutter build apk --debug > /tmp/apk.log 2>&1
          RC_APK=$?

          SUMMARY="RC_PUB=$RC_PUB RC_ANA=$RC_ANA RC_TST=$RC_TST RC_APK=$RC_APK"
          echo "$SUMMARY"
          cat /tmp/ana.log
          cat /tmp/tst.log
          tail -n 40 /tmp/apk.log

          python3 - <<PY
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          msg = (
              "$SUMMARY\n---ANA---\n" + open('/tmp/ana.log').read()[-2000:] +
              "\n---TST---\n" + open('/tmp/tst.log').read()[-2000:] +
              "\n---APK---\n" + open('/tmp/apk.log').read()[-2500:]
          )
          subprocess.run(
              ['gh', 'api', f'repos/{repo}/commits/{sha}/comments', '-f', f'body={msg[:6000]}'],
              check=False,
          )
          PY

          test $RC_PUB -eq 0 && test $RC_ANA -eq 0 && test $RC_TST -eq 0 && test $RC_APK -eq 0
