name: RE-Frida 密钥猎杀矩阵 v11

on:
  workflow_dispatch: {}
  push:
    branches:
      - re/frida-*

permissions:
  contents: write

env:
  PKG: com.hbsclj.uth
  APK_URL: 'https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTY1MTEyMTU0NzpNRVJDSEFOVDpbQkA3MzE3MjYyZToyNDE5OTczMjAyMzU0Nw%3D%3D.apk'
  APK_SHA: '235162605907f6c26c39d3f877af387a915ea8b6f3ca000d358111a0aefa2ab2'
  APK_SIZE: '43291746'
  API: '33'
  ABI: 'x86_64'
  AVD_NAME: probe

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [procfs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 0. Bootstrap
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "VARIANT=${{ matrix.variant }}" >> "$GITHUB_ENV"
          echo "BR=re/frida-$TS-${{ matrix.variant }}" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "dyn/$TS"
          echo "== start $(date -u) variant=${{ matrix.variant }} ==" >> "dyn/$TS/run.log"
          cat > /tmp/hb.sh <<'HB'
          #!/usr/bin/env bash
          cd "$GITHUB_WORKSPACE" || exit 0
          FULL=0
          if [ "$1" = "-a" ]; then FULL=1; shift; fi
          TS="$1"; shift
          echo "[$(date -u +%H:%M:%S)] $*" >> "dyn/$TS/run.log"
          git add -A "dyn/$TS" 2>/dev/null || true
          git add frida-hit 2>/dev/null || true
          git commit -q -m "hb: ${{ matrix.variant }} $*" 2>/dev/null
          git push -q origin "HEAD:refs/heads/re/frida-$TS-${{ matrix.variant }}" 2>/dev/null || true
          HB
          chmod +x /tmp/hb.sh
          /tmp/hb.sh "$TS" init

      - name: 1. APK 下载+校验
        if: ${{ matrix.variant != 'offlinebrute' }}
        run: |
          RC=0
          curl -fsSL --retry 3 --max-time 600 -o /tmp/app.apk "$APK_URL" || RC=$?
          GOT=$(sha256sum /tmp/app.apk 2>/dev/null | cut -d' ' -f1 || echo none)
          echo "curl_exit=$RC sha=$GOT" >> "dyn/$TS/run.log"
          if [ "$GOT" != "$APK_SHA" ]; then
            echo "APK_URL 速朽，走 configv2 回落" >> "dyn/$TS/run.log"
            NEW=$(curl -fsSL --max-time 30 -A "Dart/3.5 (dart:io)" "http://cdn.mechat.fun/app/api/configv2" | python3 -c "import sys,re; m=re.findall(r'https?://[^\"]+\.apk', sys.stdin.read()); print(m[0] if m else '')")
            echo "new_url=$NEW" >> "dyn/$TS/run.log"
            if [ -n "$NEW" ]; then curl -fsSL --retry 3 --max-time 600 -o /tmp/app.apk "$NEW"; GOT=$(sha256sum /tmp/app.apk | cut -d' ' -f1); fi
            [ "$GOT" = "$APK_SHA" ] || { /tmp/hb.sh "$TS" apk-failed; exit 1; }
          fi
          /tmp/hb.sh "$TS" downloaded

      - name: 2. 工具链+frida客户端+PATH注入
        if: ${{ matrix.variant != 'offlinebrute' }}
        run: |
          export PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH
          sudo chmod 666 /dev/kvm >> "dyn/$TS/run.log" 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "emulator" "platform-tools" "system-images;android-$API;google_apis;$ABI" >> "dyn/$TS/sdk.log" 2>&1 || true
          ls "/usr/local/lib/android/sdk/system-images/android-$API/google_apis/$ABI" >/dev/null 2>&1 || { /tmp/hb.sh "$TS" sdk-image-missing; exit 1; }
          pip3 install -q frida==16.5.9 pycryptodome pillow >> "dyn/$TS/sdk.log" 2>&1 || true
          echo "PATH=/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/emulator:$PATH" >> "$GITHUB_ENV"
          python3 -c "import frida; print('frida', frida.__version__)" >> "dyn/$TS/run.log" 2>&1 || true
          /tmp/hb.sh "$TS" toolchain-ready

      - name: 3. AVD
        if: ${{ matrix.variant != 'offlinebrute' }}
        run: |
          export PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH
          unset ANDROID_AVD_HOME ANDROID_SDK_HOME ANDROID_USER_HOME ANDROID_PREFS_ROOT
          echo no | avdmanager -v create avd -n "$AVD_NAME" -k "system-images;android-$API;google_apis;$ABI" -d pixel_5 --force >> "dyn/$TS/avd.log" 2>&1 || echo no | avdmanager -v create avd -n "$AVD_NAME" -k "system-images;android-$API;google_apis;$ABI" --force >> "dyn/$TS/avd.log" 2>&1
          INI=$(find "$HOME" -maxdepth 4 -name "$AVD_NAME.ini" 2>/dev/null | head -1)
          [ -n "$INI" ] || { /tmp/hb.sh "$TS" avd-missing; exit 1; }
          AVD_HOME=$(dirname "$INI")
          echo "AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          /tmp/hb.sh "$TS" avd-ready

      - name: 4. 模拟器+装机+启动App
        if: ${{ matrix.variant != 'offlinebrute' }}
        run: |
          export ANDROID_AVD_HOME="$AVD_HOME"
          EMU=/usr/local/lib/android/sdk/emulator/emulator
          OPTS="-avd $AVD_NAME -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none -writable-system"
          nohup $EMU $OPTS -accel on > "dyn/$TS/emulator.log" 2>&1 & EMU_PID=$!
          sleep 20
          if ! kill -0 "$EMU_PID" 2>/dev/null; then
            echo "accel on 失败回退 off" >> "dyn/$TS/run.log"
            nohup $EMU $OPTS -accel off > "dyn/$TS/emulator.log" 2>&1 & EMU_PID=$!
            sleep 20
          fi
          echo "EMU_PID=$EMU_PID" >> "$GITHUB_ENV"
          adb start-server >> "dyn/$TS/run.log" 2>&1 || true
          BOOTED=0
          for i in $(seq 1 60); do
            B=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOTED=1; echo "boot_ok_loop=$i" >> "dyn/$TS/run.log"; break; fi
            sleep 10
          done
          [ "$BOOTED" = "1" ] || { /tmp/hb.sh "$TS" boot-timeout; exit 1; }
          timeout 60 adb shell settings put global window_animation_scale 0 || true
          timeout 60 adb shell settings put global transition_animation_scale 0 || true
          timeout 60 adb shell settings put global animator_duration_scale 0 || true
          adb root >> "dyn/$TS/run.log" 2>&1 || true; sleep 3
          adb install -r -g /tmp/app.apk >> "dyn/$TS/install.log" 2>&1 || { /tmp/hb.sh "$TS" install-failed; exit 1; }
          adb shell am start -n "$PKG/.MainActivity" >> "dyn/$TS/run.log" 2>&1 || true
          sleep 30
          /tmp/hb.sh "$TS" app-up

      - name: 5. frida-server 部署
        if: ${{ matrix.variant != 'procfs' && matrix.variant != 'offlinebrute' }}
        run: |
          curl -fsSL --max-time 300 -o /tmp/fs.xz "https://github.com/frida/frida/releases/download/16.5.9/frida-server-16.5.9-android-x86_64.xz" || { /tmp/hb.sh "$TS" frida-dl-failed; exit 1; }
          xz -d -k -f /tmp/fs.xz
          adb push /tmp/fs /data/local/tmp/fs >> "dyn/$TS/run.log" 2>&1
          adb shell "chmod 755 /data/local/tmp/fs; (su 0 /data/local/tmp/fs >/dev/null 2>&1 &) || (/data/local/tmp/fs >/dev/null 2>&1 &)" || true
          sleep 5
          adb shell "ps -A | grep fs | head -2" >> "dyn/$TS/run.log" 2>&1 || true
          /tmp/hb.sh "$TS" frida-server-up

      - name: 6c. 采集器[glob32]
        if: ${{ matrix.variant == 'glob32' }}
        run: |
          PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
          if [ -z "$PID" ]; then
            for i in $(seq 1 12); do
              adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
              sleep 5
              PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
              [ -n "$PID" ] && break
            done
          fi
          if [ -z "$PID" ]; then
            echo "NO_PID: App 进程不存在，采集器无法挂载" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a no-pid
            exit 1
          fi
          echo "PID=$PID" >> "$GITHUB_ENV"
          echo "" | base64 -d > /tmp/collector.py
          echo "" | base64 -d > /tmp/variant.js
          nohup python3 /tmp/collector.py "$PID" /tmp/variant.js /tmp/cands.jsonl 900 > /tmp/collector.out 2>&1 &
          echo $! > /tmp/col.pid
          echo "collector=$VARIANT pid=$PID" >> "dyn/$TS/run.log"

      - name: 6c. 采集器[evphook]
        if: ${{ matrix.variant == 'evphook' }}
        run: |
          PORT_INIT=1
          PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
          if [ -z "$PID" ]; then
            for i in $(seq 1 12); do
              adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
              sleep 5
              PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
              [ -n "$PID" ] && break
            done
          fi
          if [ -z "$PID" ]; then
            echo "NO_PID: App 进程不存在，采集器无法挂载" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a no-pid
            exit 1
          fi
          echo "PID=$PID" >> "$GITHUB_ENV"
          echo "" | base64 -d > /tmp/collector.py
          echo "" | base64 -d > /tmp/variant.js
          nohup python3 /tmp/collector.py "$PID" /tmp/variant.js /tmp/cands.jsonl 900 > /tmp/collector.out 2>&1 &
          echo $! > /tmp/col.pid
          echo "collector=evphook pid=$PID" >> "dyn/$TS/run.log"
      - name: 6c. 采集器[sbox]
        if: ${{ matrix.variant == 'sbox' }}
        run: |
          PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
          if [ -z "$PID" ]; then
            for i in $(seq 1 12); do
              adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
              sleep 5
              PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
              [ -n "$PID" ] && break
            done
          fi
          if [ -z "$PID" ]; then
            echo "NO_PID: App 进程不存在，采集器无法挂载" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a no-pid
            exit 1
          fi
          echo "PID=$PID" >> "$GITHUB_ENV"
          echo "" | base64 -d > /tmp/collector.py
          echo "" | base64 -d > /tmp/variant.js
          nohup python3 /tmp/collector.py "$PID" /tmp/variant.js /tmp/cands.jsonl 900 > /tmp/collector.out 2>&1 &
          echo $! > /tmp/col.pid
          echo "collector=$VARIANT pid=$PID" >> "dyn/$TS/run.log"

      - name: 6c. 采集器[writehook]
        if: ${{ matrix.variant == 'writehook' }}
        run: |
          PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
          if [ -z "$PID" ]; then
            for i in $(seq 1 12); do
              adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
              sleep 5
              PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
              [ -n "$PID" ] && break
            done
          fi
          if [ -z "$PID" ]; then
            echo "NO_PID: App 进程不存在，采集器无法挂载" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a no-pid
            exit 1
          fi
          echo "PID=$PID" >> "$GITHUB_ENV"
          echo "" | base64 -d > /tmp/collector.py
          echo "" | base64 -d > /tmp/variant.js
          echo "" | base64 -d >> /tmp/variant.js
          nohup python3 /tmp/collector.py "$PID" /tmp/variant.js /tmp/cands.jsonl 900 > /tmp/collector.out 2>&1 &
          echo $! > /tmp/col.pid
          echo "collector=$VARIANT pid=$PID" >> "dyn/$TS/run.log"

      - name: 6c. 采集器[sockethook]
        if: ${{ matrix.variant == 'sockethook' }}
        run: |
          PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
          if [ -z "$PID" ]; then
            for i in $(seq 1 12); do
              adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
              sleep 5
              PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
              [ -n "$PID" ] && break
            done
          fi
          if [ -z "$PID" ]; then
            echo "NO_PID: App 进程不存在，采集器无法挂载" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a no-pid
            exit 1
          fi
          echo "PID=$PID" >> "$GITHUB_ENV"
          echo "" | base64 -d > /tmp/collector.py
          echo "" | base64 -d > /tmp/variant.js
          echo "" | base64 -d >> /tmp/variant.js
          nohup python3 /tmp/collector.py "$PID" /tmp/variant.js /tmp/cands.jsonl 900 > /tmp/collector.out 2>&1 &
          echo $! > /tmp/col.pid
          echo "collector=$VARIANT pid=$PID" >> "dyn/$TS/run.log"

      - name: 6c. 采集器[javabridge]
        if: ${{ matrix.variant == 'javabridge' }}
        run: |
          PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
          if [ -z "$PID" ]; then
            for i in $(seq 1 12); do
              adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
              sleep 5
              PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
              [ -n "$PID" ] && break
            done
          fi
          if [ -z "$PID" ]; then
            echo "NO_PID: App 进程不存在，采集器无法挂载" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a no-pid
            exit 1
          fi
          echo "PID=$PID" >> "$GITHUB_ENV"
          echo "" | base64 -d > /tmp/collector.py
          echo "" | base64 -d > /tmp/variant.js
          echo "" | base64 -d >> /tmp/variant.js
          nohup python3 /tmp/collector.py "$PID" /tmp/variant.js /tmp/cands.jsonl 900 > /tmp/collector.out 2>&1 &
          echo $! > /tmp/col.pid
          echo "collector=$VARIANT pid=$PID" >> "dyn/$TS/run.log"

      - name: 6p. [procfs] 采集器跳过
        if: ${{ matrix.variant == 'procfs' }}
        run: |
          echo "procfs: post-harvest instead" >> "dyn/$TS/run.log"
      - name: 2b. [offlinebrute] 依赖安装
        if: ${{ matrix.variant == 'offlinebrute' }}
        run: |
          pip3 install -q pycryptodome pillow >> "dyn/$TS/sdk.log" 2>&1 || true
          python3 -c "import Crypto, PIL; print('deps ok')" >> "dyn/$TS/run.log" 2>&1 || true

      - name: 6o. [offlinebrute] 跳过模拟器
        if: ${{ matrix.variant == 'offlinebrute' }}
        run: |
          echo "offlinebrute: no emulator" >> "dyn/$TS/run.log"

      - name: 7. UI 驱动（状态机版：首页→封面→详情→开始阅读→登录→阅读器）
        if: ${{ matrix.variant != 'offlinebrute' }}
        run: |
          A() { timeout 25 adb shell "$@" || true; }
          SH() { timeout 40 adb exec-out screencap -p > "dyn/$TS/$1" 2>/dev/null || true; }
          ST() { python3 /tmp/state.py "dyn/$TS/$1" "/tmp/ST_$2" "$2" >> "dyn/$TS/run.log" 2>&1 || true; cat "/tmp/ST_$2" 2>/dev/null || echo 0; }
          echo "" | base64 -d > /tmp/state.py
          echo "" | base64 -d > /tmp/cb.py
          FG() {
            for i in 1 2 3 4 5 6; do
              R=$(adb shell dumpsys activity activities 2>/dev/null | grep -m1 mResumedActivity || true)
              echo "fg[$i]=$R" >> "dyn/$TS/run.log"
              echo "$R" | grep -q "$PKG" && return 0
              adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
              sleep 4
            done
            return 1
          }
          goto_detail() {
            for i in 1 2 3 4; do
            FG || true
              A input tap 105 2100; sleep 7
              SH nav-home.png
              A input tap 270 700; sleep 22
              SH nav-detail.png
              if [ "$(ST nav-detail.png detail)" = "1" ]; then echo "detail_ok=$i" >> "dyn/$TS/run.log"; return 0; fi
              echo "detail_miss=$i" >> "dyn/$TS/run.log"
              A input keyevent 4; sleep 3
            done
            return 1
          }
          fill_login() {
            A input tap 450 640; sleep 3
            A input tap 450 700; sleep 2
            A input text "928081274@qq.com"; sleep 3
            A input keyevent 111; sleep 2
            A input tap 450 815; sleep 3
            A input tap 450 875; sleep 2
            A input text "Zmh20100227"; sleep 3
            A input keyevent 111; sleep 3
            A input tap 78 950; sleep 3
            SH cb.png
            python3 /tmp/cb.py "dyn/$TS/cb.png" /tmp/CB >> "dyn/$TS/run.log" 2>&1 || true
            if [ "$(cat /tmp/CB 2>/dev/null || echo 0)" != "1" ]; then A input tap 78 1015; sleep 2; fi
            SH inter-loginfilled.png
            A input tap 540 1157; sleep 20
            SH inter-loggedin.png
          }
          rm -f /tmp/go_dump /tmp/ST_* /tmp/CB
          FG || true
          sleep 30
          A input tap 925 715; sleep 6; A input tap 925 715; sleep 6
          SH inter-modal.png
          if ! goto_detail; then
            echo "NAVFAIL: 三次尝试未进详情页" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a nav-fail
            exit 1
          fi
          A input tap 700 2150; sleep 18
          SH inter-afterclick.png
          if [ "$(ST inter-afterclick.png login)" = "1" ]; then
            cp "dyn/$TS/inter-afterclick.png" "dyn/$TS/inter-loginpage.png"
            for attempt in 1 2; do
              echo "login_attempt=$attempt" >> "dyn/$TS/run.log"
              fill_login
              if [ "$(ST inter-loggedin.png login)" = "0" ]; then echo "login_ok=$attempt" >> "dyn/$TS/run.log"; break; fi
              echo "login_retry_$attempt" >> "dyn/$TS/run.log"
            done
            if [ "$(ST inter-loggedin.png login)" = "1" ]; then
              echo "LOGINFAIL: 两次填表后仍在登录墙" >> "dyn/$TS/run.log"
              /tmp/hb.sh "$TS" -a login-fail
              exit 1
            fi
            SH inter-postlogin.png
            if [ "$(ST inter-postlogin.png shelf)" = "1" ]; then
              echo "postlogin=shelf" >> "dyn/$TS/run.log"
              if ! goto_detail; then echo "NAVFAIL2: 登录后回不到详情" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" -a nav2-fail; exit 1; fi
            elif [ "$(ST inter-postlogin.png detail)" = "1" ]; then
              echo "postlogin=detail" >> "dyn/$TS/run.log"
            else
              echo "postlogin=reader" >> "dyn/$TS/run.log"
            fi
          fi
          if [ "${{ matrix.variant }}" = "procfs" ]; then
            A input tap 700 2150; sleep 22
            SH fast-reader.png
            if [ "$(ST fast-reader.png reader)" = "0" ]; then
              echo "READERFAIL: 22s 后未进入阅读器" >> "dyn/$TS/run.log"
              /tmp/hb.sh "$TS" -a reader-fail
              exit 1
            fi
            echo "v11 reader ok, page loop goes in 7b" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" reader-entry-ok
            exit 0
          fi
          A input tap 700 2150; sleep 3
          touch /tmp/go_dump
          echo "go_dump armed during decrypt" >> "dyn/$TS/run.log"
          sleep 40
          SH inter-page0.png
          if [ "$(ST inter-page0.png login)" = "1" ]; then
            echo "READERFAIL: 触发阅读后仍回登录墙" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a reader-fail
            exit 1
          fi
          touch /tmp/go_dump
          echo "go_dump armed at reader" >> "dyn/$TS/run.log"
          for s in 1 2 3 4 5 6 7 8; do
            A input swipe 540 1800 540 600 400; sleep 10
            SH inter-page$s.png
          done
          sleep 10
          echo "uiflow=done" >> "dyn/$TS/run.log"
          /tmp/hb.sh "$TS" uidrive-done

      - name: 7b. 39 页翻阅 + 分段 dump + 明密文配对/密钥流提取
        if: ${{ matrix.variant == 'procfs' }}
        run: |
          A() { timeout 25 adb shell "$@" || true; }
          SH() { timeout 40 adb exec-out screencap -p > "dyn/$TS/$1" 2>/dev/null || true; }
          echo "" | base64 -d > /tmp/heap.py
          mkdir -p /tmp/ct
          OK=0
          for n in $(seq 1 39); do
            if [ -s "/tmp/ct/$n.jpg" ]; then OK=$((OK+1)); continue; fi
            curl -s --max-time 20 -A 'Dart/3.5 (dart:io)' -o "/tmp/ct/$n.jpg" "http://img2.mechat.fun/3/26824/492177/$n.jpg" || true
            [ -s "/tmp/ct/$n.jpg" ] && OK=$((OK+1))
          done
          echo "ct_download_ok=$OK" >> "dyn/$TS/run.log"
          du -sh /tmp/ct >> "dyn/$TS/run.log" 2>/dev/null || true
          PID=$(adb shell pidof $PKG | tr -d '\r[:space:]')
          echo "v11 pid=$PID" >> "dyn/$TS/run.log"
          if [ -z "$PID" ]; then echo "NO_PID" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" -a no-pid; exit 1; fi
          for p in $(seq 1 39); do
            A input swipe 540 1850 540 520 320
            sleep 4
            if [ $((p % 4)) -eq 0 ]; then
              echo "== dump at page $p ==" >> "dyn/$TS/run.log"
              python3 /tmp/heap.py "$PID" "$TS" "p$p" 2>&1 | tee -a "dyn/$TS/heap.log" || true
              rm -f "/tmp/heap_p$p.bin"
              SH "page$p.png"
              /tmp/hb.sh "$TS" "dump-p$p"
            fi
          done
          python3 /tmp/heap.py "$PID" "$TS" "final" 2>&1 | tee -a "dyn/$TS/heap.log" || true
          rm -f /tmp/heap_final.bin
          cp /tmp/hv_*.jpg "dyn/$TS/" 2>/dev/null || true
          cp /tmp/kstr_page*.bin "dyn/$TS/" 2>/dev/null || true
          cp /tmp/heap_report.txt "dyn/$TS/heap_report.txt" 2>/dev/null || true
          /tmp/hb.sh "$TS" heapbrute-done

      - name: 8. 停止采集器（先等倾倒完成再杀）
        if: ${{ matrix.variant != 'procfs' && matrix.variant != 'offlinebrute' }}
        run: |
          for i in $(seq 1 150); do
            grep -qa "collector_done" /tmp/cands.jsonl 2>/dev/null && break
            if grep -qa "dumpdone" /tmp/cands.jsonl 2>/dev/null; then sleep 10; break; fi
            sleep 2
          done
          kill $(cat /tmp/col.pid) 2>/dev/null || true
          sleep 3
          wc -l /tmp/cands.jsonl >> "dyn/$TS/run.log" 2>&1 || true
          ls -la /tmp/memdump.bin >> "dyn/$TS/run.log" 2>&1 || true
          ls /tmp/ctx_*.bin >> "dyn/$TS/run.log" 2>&1 | head -20 || true

      - name: 9. 候选验证
        run: |
          touch /tmp/cands.jsonl 2>/dev/null || true
          echo "" | base64 -d > /tmp/verify.py
          python3 /tmp/verify.py >> "dyn/$TS/run.log" 2>&1 || true
          if [ ! -f /tmp/verify_report.txt ]; then
            echo "GATE-FAIL: 验证器未产出报告，说明上游失败被吞" >> "dyn/$TS/run.log"
            /tmp/hb.sh "$TS" -a verify-missing
            exit 1
          fi
          if grep -qa KEYFOUND-CONFIRMED "dyn/$TS/run.log"; then
            mkdir -p frida-hit
            cp /tmp/verify_report.txt frida-hit/ 2>/dev/null || true
            /tmp/hb.sh "$TS" -a KEYFOUND
          fi
          cp /tmp/cands.jsonl "dyn/$TS/" 2>/dev/null || true
          cp /tmp/verify_report.txt "dyn/$TS/" 2>/dev/null || true
          cp /tmp/collector.out "dyn/$TS/" 2>/dev/null || true
          if [ -f /tmp/memdump.bin ]; then gzip -1 -c /tmp/memdump.bin > "dyn/$TS/memdump.gz" 2>/dev/null || true; fi
          /tmp/hb.sh "$TS" -a done

      - name: 10. 收尾清单
        run: |
          ls -la dyn/$TS >> "dyn/$TS/run.log" 2>&1 || true

      - name: 11. Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-hunt-${{ matrix.variant }}
          path: dyn/
          if-no-files-found: ignore
          retention-days: 7

      - name: 11b. Upload hit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-hit-${{ matrix.variant }}
          path: frida-hit/
          if-no-files-found: ignore
          retention-days: 30