name: RE-APK 静态首轮

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK 下载地址（留空用默认 ad-app）'
        required: false
      tag:
        description: '报告目录名（留空用 sha12）'
        required: false
  push:
    paths:
      - '.github/workflows/reverse-apk.yml'

permissions:
  contents: write

env:
  DEFAULT_APK_URL: 'https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTY1MTEyMTU0NzpNRVJDSEFOVDpbQkA3MzE3MjYyZToyNDE5OTczMjAyMzU0Nw%3D%3D.apk'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 装工具链（固定版本 + 哈希校验）
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq unzip curl openssl ninja-build cmake git pkg-config libcapstone-dev > /dev/null
          curl -fsSL --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -
          sudo mv /tmp/apktool.jar /opt/apktool.jar
          sudo tee /usr/local/bin/apktool > /dev/null <<'EOF'
          #!/bin/sh
          exec java -Xmx2g -jar /opt/apktool.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/apktool
          curl -fsSL --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          echo '1755e4242ade71a077438723689f404079592ec7764a3a0572f98fef94ebcbf3  /tmp/jadx.zip' | sha256sum -c -
          sudo rm -rf /opt/jadx && sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          pip3 install --break-system-packages -q apkid pyelftools requests || echo '部分 pip 包跳过'
          echo '--- 自检 ---'
          java -version 2>&1 | head -1
          apktool --version
          jadx --version | head -1
          python3 -c 'import elftools; print("pyelftools ok")'
          pkg-config --modversion capstone

      - name: 下载 APK 并记录哈希
        env:
          INPUT_URL: ${{ github.event.inputs.apk_url }}
        run: |
          URL="${INPUT_URL:-$DEFAULT_APK_URL}"
          mkdir -p work
          curl -fsSL --retry 3 --max-time 900 -o work/app.apk "$URL"
          ls -lh work/app.apk
          sha256sum work/app.apk | tee work/sha256.txt

      - name: 解包（保留原始 dex）
        run: apktool d -f -s -o work/decoded work/app.apk > work/apktool.log 2>&1

      - name: 加固指纹
        run: apkid -j work/app.apk > work/apkid.json 2>/dev/null || echo 'apkid 无输出'

      - name: jadx 反编译（记录状态，不阻塞）
        run: |
          set +e
          export JAVA_OPTS='-Xmx6g'
          timeout 3600 jadx -d work/jadx --no-res --threads-count 8 work/app.apk > work/jadx.log 2>&1
          RC=$?
          echo "jadx_exit=$RC" | tee work/jadx.status
          tail -3 work/jadx.log || true
          exit 0

      - name: Dart AOT 深挖（blutter，尽力而为）
        continue-on-error: true
        run: |
          set +e
          git clone --depth 1 https://github.com/worawit/blutter /opt/blutter
          mkdir -p work/blutter
          cd /opt/blutter
          timeout 2400 python3 blutter.py "$GITHUB_WORKSPACE/work/decoded/lib/arm64-v8a" "$GITHUB_WORKSPACE/work/blutter" > "$GITHUB_WORKSPACE/work/blutter.log" 2>&1
          echo "blutter_exit=$?" | tee "$GITHUB_WORKSPACE/work/blutter.status"
          tail -20 "$GITHUB_WORKSPACE/work/blutter.log"
          ls -la "$GITHUB_WORKSPACE/work/blutter" | head -20
          cp "$GITHUB_WORKSPACE/work/blutter.log" "$GITHUB_WORKSPACE/work/blutter.log.full"
          exit 0

      - name: 生成静态报告
        run: python3 re/analyze_apk.py --apk work/app.apk --decoded work/decoded --apkid work/apkid.json --outdir work

      - name: Dart 文案提取（UTF-16 兜底）
        run: python3 re/dart_strings.py --decoded work/decoded --outdir work

      - name: 把深挖结果并入报告
        run: |
          grep -m1 'Dart version' work/blutter.log > work/dartver.txt 2>/dev/null || true
          {
            echo ''
            echo '## 深挖状态（机器生成）'
            echo "- jadx: $(cat work/jadx.status 2>/dev/null || echo '未运行')"
            echo "- blutter: $(cat work/blutter.status 2>/dev/null || echo '未运行')"
            echo "- Dart 引擎信息: $(cat work/dartver.txt 2>/dev/null || echo '未识别')"
            if [ -s work/blutter/pp.txt ]; then
              echo "- blutter 产物: pp.txt $(wc -l < work/blutter/pp.txt) 行"
            else
              echo '- blutter 未产出 pp.txt'
            fi
            echo ''
            echo '### blutter 日志末尾'
            echo '```'
            tail -8 work/blutter.log 2>/dev/null || echo '无日志'
            echo '```'
          } >> work/report.md
          cat work/dart-findings.md >> work/report.md 2>/dev/null || true

      - name: 写入 Job Summary
        run: |
          echo '## APK 静态首轮报告' >> "$GITHUB_STEP_SUMMARY"
          cat work/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 报告提交到分支
        run: |
          SHA12=$(cut -c1-12 work/sha256.txt)
          DEST="reports/apk-${SHA12}"
          mkdir -p "$DEST" work/app-src
          cp work/report.md work/facts.json work/domains.txt work/jadx.status "$DEST/"
          cp work/dart-findings.md "$DEST/" 2>/dev/null || true
          cp work/blutter.status "$DEST/" 2>/dev/null || true
          cp work/blutter.log "$DEST/" 2>/dev/null || true
          cp work/decoded/AndroidManifest.xml "$DEST/AndroidManifest.xml"
          cp -r work/jadx/sources/com/hbsclj "work/app-src/" 2>/dev/null || true
          cp work/blutter/pp.txt "$DEST/dart-pp.txt" 2>/dev/null || true
          git config user.name 're-bot'
          git config user.email 're-bot@users.noreply.github.com'
          git checkout -B "re/apk-${SHA12}"
          git add "$DEST"
          git commit -m "re: APK 静态首轮报告 ${SHA12}" || echo '无变更'
          git push --force origin "re/apk-${SHA12}"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-re-${{ github.run_number }}
          path: |
            work/report.md
            work/facts.json
            work/domains.txt
            work/apkid.json
            work/apktool.log
            work/jadx.log
            work/blutter.log
            work/blutter/pp.txt
            work/app-src
          retention-days: 14
