name: Lanerc 1.0.8 isolated emulator smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - arena/438dce37-zawu

permissions:
  contents: read

jobs:
  smoke-test:
    name: Android API ${{ matrix.api-level }} (x86_64, offline)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Retry on an older and a newer Android image if the shell/SDK has API-specific issues.
        api-level: [28, 30]

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4

      - name: Check and enable KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo 'KVM device is missing on this runner.' >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Download APK and verify its pinned SHA-256
        env:
          APK_URL: https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTYxOTIzMzQzOTpNRVJDSEFOVDpbQkAyZjc1Mjg0ZDoyMjUzNTM1MjMyOTQzOQ%3D%3D.apk
        run: |
          set -euo pipefail
          mkdir -p run-data
          curl --fail --location --silent --show-error "$APK_URL" --output lanerc.apk
          echo '4368de63ae2003138dbe63b673422a3b3a5414ab652ffb1feb3424964f88bcfd  lanerc.apk' | sha256sum --check
          printf 'APK hash verification: PASS\n' > run-data/apk-integrity.txt
          printf 'Expected package: com.clggjv.xcjfmd.ffo\nExpected version: 1.0.8\n' >> run-data/apk-integrity.txt

      - name: Install and launch with networking disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect
          working-directory: ${{ github.workspace }}
          script: bash .github/scripts/lanerc-smoke.sh "${{ matrix.api-level }}"

      - name: Upload sanitized smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanerc-1.0.8-api-${{ matrix.api-level }}-smoke
          path: run-data/
          if-no-files-found: warn
          retention-days: 3
