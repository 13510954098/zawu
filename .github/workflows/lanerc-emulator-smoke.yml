name: Lanerc 1.0.8 isolated emulator smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Android API ${{ matrix.api-level }} (x86_64, offline)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Retry on an older and a newer Android image if the shell/SDK has API-specific issues.
        api-level: [28, 30]

    steps:
      - name: Check and enable KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo 'KVM device is missing on this runner.' >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Download APK and verify its pinned SHA-256
        env:
          APK_URL: https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTYxOTIzMzQzOTpNRVJDSEFOVDpbQkAyZjc1Mjg0ZDoyMjUzNTM1MjMyOTQzOQ%3D%3D.apk
        run: |
          set -euo pipefail
          mkdir -p run-data
          curl --fail --location --silent --show-error "$APK_URL" --output lanerc.apk
          echo '4368de63ae2003138dbe63b673422a3b3a5414ab652ffb1feb3424964f88bcfd  lanerc.apk' | sha256sum --check
          printf 'APK hash verification: PASS\n' > run-data/apk-integrity.txt
          printf 'Expected package: com.clggjv.xcjfmd.ffo\nExpected version: 1.0.8\n' >> run-data/apk-integrity.txt

      - name: Install and launch with networking disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect
          script: |
            set +e
            mkdir -p run-data
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            printf 'API level: %s\nABI: %s\n' "${{ matrix.api-level }}" "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" > run-data/emulator.txt

            # Use a clean, unauthenticated emulator and keep the untrusted APK offline.
            adb shell svc wifi disable
            adb shell svc data disable
            adb logcat -c

            adb install -r lanerc.apk > run-data/install.txt 2>&1
            install_rc=$?
            if [ "$install_rc" -eq 0 ]; then
              printf 'Install: PASS\n' >> run-data/install.txt
              if adb shell pm path com.clggjv.xcjfmd.ffo 2>/dev/null | grep -q 'package:'; then
                version=$(adb shell dumpsys package com.clggjv.xcjfmd.ffo 2>/dev/null | sed -n 's/.*versionName=//p' | head -n 1 | tr -d '\r')
                printf 'Package installed: com.clggjv.xcjfmd.ffo\nObserved version: %s\n' "$version" >> run-data/install.txt
                if [ "$version" = '1.0.8' ]; then
                  identity_ok=1
                  printf 'Package/version check: PASS\n' >> run-data/install.txt
                else
                  identity_ok=0
                  printf 'Package/version check: FAIL (expected 1.0.8)\n' >> run-data/install.txt
                fi
              else
                identity_ok=0
                printf 'Package/version check: FAIL (expected package not installed)\n' >> run-data/install.txt
              fi
            else
              identity_ok=0
              printf 'Install: FAIL (adb exit %s)\n' "$install_rc" >> run-data/install.txt
            fi

            if [ "$install_rc" -eq 0 ] && [ "$identity_ok" -eq 1 ]; then
              adb shell pm clear com.clggjv.xcjfmd.ffo >/dev/null 2>&1
              adb shell monkey -p com.clggjv.xcjfmd.ffo -c android.intent.category.LAUNCHER 1 > run-data/launch.txt 2>&1
              launch_rc=$?
              sleep 15
              if [ -n "$(adb shell pidof com.clggjv.xcjfmd.ffo 2>/dev/null | tr -d '\r')" ]; then
                printf '\nApp process after 15s: RUNNING\n' >> run-data/launch.txt
              else
                printf '\nApp process after 15s: NOT RUNNING\n' >> run-data/launch.txt
              fi
              printf 'Launcher command exit: %s\n' "$launch_rc" >> run-data/launch.txt
              adb shell screencap -p /sdcard/lanerc-screen.png >/dev/null 2>&1
              adb pull /sdcard/lanerc-screen.png run-data/screenshot.png >/dev/null 2>&1
            else
              printf 'Launch: NOT ATTEMPTED (installation failed)\n' > run-data/launch.txt
            fi

            # Keep only likely app/crash lines and redact common identifiers/secrets before artifacts.
            adb logcat -d -v threadtime 2>/dev/null | grep -E 'com\.clggjv\.xcjfmd\.ffo|AndroidRuntime|Flutter|flutter|FATAL EXCEPTION' | tail -n 500 > run-data/logcat-candidate.txt || true
            python3 - <<'PY'
            import pathlib, re
            src = pathlib.Path('run-data/logcat-candidate.txt')
            text = src.read_text(errors='replace') if src.exists() else ''
            patterns = [
                (r'(?i)(authorization|cookie|bearer|token|trans.?id|device.?id|advertising.?id|android.?id|imei|oaid|gaid|phone|email)(\s*[:=]\s*)[^\s,;]+', r'\1\2[REDACTED]'),
                (r'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', '[EMAIL REDACTED]'),
                (r'\b(?:\+?\d[\d .()\-]{7,}\d)\b', '[NUMBER REDACTED]'),
                (r'\b[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}\b', '[UUID REDACTED]'),
            ]
            for pattern, replacement in patterns:
                text = re.sub(pattern, replacement, text)
            pathlib.Path('run-data/app-crash-log-sanitized.txt').write_text(text[-150000:])
            src.unlink(missing_ok=True)
            PY

      - name: Upload sanitized smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanerc-1.0.8-api-${{ matrix.api-level }}-smoke
          path: run-data/
          if-no-files-found: warn
          retention-days: 3
