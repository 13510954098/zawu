name: RE-APK 动态探针 v3.2

# v3 全量改造（v2.1 实测发现，非修补）：
# 1) v2.1 实锤：emulator -tcpdump 只在前 ~5 秒有效（109 帧全在前 5s，App 实际下载 2.9MB 未入包）。
#    -> 新增宿主机侧 sudo tcpdump 全量抓包：guest 流量经 slirp 以 qemu 进程套接字出现在宿主机，
#       全程不漏；原 -tcpdump 保留作 tertiary 佐证。
# 2) 新增 mitmproxy 明文链路：emulator -http-proxy 工作在 QEMU slirp/NAT 层，
#    代理地址必须写 127.0.0.1（10.0.2.2 从宿主机侧解析不存在，v3 实测超时被忽略） -> HTTPS 可被 mitm 拦截还原为明文。
#    CA 安装：-writable-system + adb root + disable-verity + remount + 推入 /system/etc/security/cacerts。
#    任一环节失败只记日志不阻断（仍有 host.pcap 的 SNI/IP 全量兜底）。
# 3) 观测循环加入交互：关公告弹窗（多坐标尝试）、点开漫画详情、翻页，触发更多业务 API 与广告链路。
# 4) 心跳（文本先行，收尾 -a 全量）、datadir.tar、并发防环、push 触发限定 re/first-pass —— 全部保持 v2.1。
# 5) QUIC/UDP443 与 DoT 不经 HTTP 代理，但 host.pcap 全量可见。

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'App 运行观测时长（分钟，5-20）'
        required: false
        default: '12'
  push:
    branches:
      - re/first-pass

permissions:
  contents: write

concurrency:
  group: dyn-probe
  cancel-in-progress: false

env:
  PKG: com.hbsclj.uth
  APK_URL: 'https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTY1MTEyMTU0NzpNRVJDSEFOVDpbQkA3MzE3MjYyZToyNDE5OTczMjAyMzU0Nw%3D%3D.apk'
  APK_SHA: '235162605907f6c26c39d3f877af387a915ea8b6f3ca000d358111a0aefa2ab2'
  APK_SIZE: '43291746'
  API: '33'
  ABI: 'x86_64'
  AVD_NAME: probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 0. Bootstrap（结果分支 + 心跳）
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "BR=re/dyn-$TS" >> "$GITHUB_ENV"
          DUR="${{ inputs.duration_minutes || '12' }}"
          echo "DUR=$DUR" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "dyn/$TS"
          {
            echo "== start $(date -u) =="
            echo "arch=$(uname -m) cpu=$(nproc)"
            echo "disk_free=$(df -BG / | tail -1 | awk '{print $4}')"
          } >> "dyn/$TS/run.log"
          cat > /tmp/hb.sh <<'HB'
          #!/usr/bin/env bash
          # 用法: hb.sh [-a] TS 说明   （-a = 连 png/pcap/tar/flows 一起提交，仅收尾用）
          cd "$GITHUB_WORKSPACE" || exit 0
          FULL=0
          if [ "$1" = "-a" ]; then FULL=1; shift; fi
          TS="$1"; shift
          echo "[$(date -u +%H:%M:%S)] $*" >> "dyn/$TS/run.log"
          if [ "$FULL" = "1" ]; then
            git add -A "dyn/$TS" 2>/dev/null
          else
            git add "dyn/$TS/run.log" 2>/dev/null
            for f in "dyn/$TS"/*.log "dyn/$TS"/*.txt "dyn/$TS"/*.md; do
              [ -f "$f" ] && git add "$f" 2>/dev/null
            done
          fi
          git commit -q -m "hb: $*" 2>/dev/null
          git push -q origin "HEAD:refs/heads/re/dyn-$TS" 2>/dev/null || true
          HB
          chmod +x /tmp/hb.sh
          /tmp/hb.sh "$TS" init-v32

      - name: 1. 下载 APK 并校验
        run: |
          RC=0
          curl -fsSL --retry 3 --max-time 600 -o /tmp/app.apk "$APK_URL" || RC=$?
          echo "curl_exit=$RC" >> "dyn/$TS/run.log"
          [ $RC -eq 0 ] || { /tmp/hb.sh "$TS" download-failed; exit 1; }
          GOT=$(sha256sum /tmp/app.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s /tmp/app.apk)
          {
            echo "size=$SIZE expect=$APK_SIZE"
            echo "sha=$GOT"
            echo "expect_sha=$APK_SHA"
          } >> "dyn/$TS/run.log"
          /tmp/hb.sh "$TS" downloaded
          [ "$GOT" = "$APK_SHA" ] || { /tmp/hb.sh "$TS" sha-mismatch; exit 1; }

      - name: 2. 工具链（KVM / tcpdump / mitmproxy / SDK / 系统镜像）
        run: |
          export PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH
          ls -l /dev/kvm >> "dyn/$TS/run.log" 2>&1 || true
          sudo chmod 666 /dev/kvm >> "dyn/$TS/run.log" 2>&1 || true
          /usr/local/lib/android/sdk/emulator/bin/kvm-ok >> "dyn/$TS/run.log" 2>&1 || echo "kvm-ok: 不可用" >> "dyn/$TS/run.log"
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark tcpdump openssl >/dev/null 2>&1 || true
          echo "tshark=$(command -v tshark || echo none) tcpdump=$(command -v tcpdump || echo none)" >> "dyn/$TS/run.log"
          MITM_BIN=$(command -v mitmdump || echo none)
          if [ "$MITM_BIN" = "none" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mitmproxy >/dev/null 2>&1 || true
            MITM_BIN=$(command -v mitmdump || echo none)
          fi
          if [ "$MITM_BIN" = "none" ]; then
            pip3 install --quiet --user mitmproxy >> "dyn/$TS/sdk.log" 2>&1 || true
            MITM_BIN="$HOME/.local/bin/mitmdump"
          fi
          echo "mitmdump=$MITM_BIN" >> "dyn/$TS/run.log"
          [ -x "$MITM_BIN" ] || { /tmp/hb.sh "$TS" mitmdump-missing; exit 1; }
          echo "MITM_BIN=$MITM_BIN" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          RC=0
          sdkmanager --install "emulator" "platform-tools" "system-images;android-$API;google_apis;$ABI" >> "dyn/$TS/sdk.log" 2>&1 || RC=$?
          echo "sdk_exit=$RC" >> "dyn/$TS/run.log"
          ls "/usr/local/lib/android/sdk/system-images/android-$API/google_apis/$ABI" >/dev/null 2>&1 || { /tmp/hb.sh "$TS" sdk-image-missing; exit 1; }
          ADB_BIN=/usr/local/lib/android/sdk/platform-tools/adb
          [ -x "$ADB_BIN" ] || { echo "adb 缺失: $ADB_BIN" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" adb-missing; exit 1; }
          echo "adb=$($ADB_BIN version | head -1)" >> "dyn/$TS/run.log"
          echo "emulator=$(/usr/local/lib/android/sdk/emulator/emulator -version 2>/dev/null | head -1)" >> "dyn/$TS/run.log"
          /tmp/hb.sh "$TS" toolchain-ready

      - name: 3. 创建 AVD（自检 probe.ini / config.ini / list-avds）
        run: |
          unset ANDROID_AVD_HOME ANDROID_SDK_HOME ANDROID_USER_HOME ANDROID_PREFS_ROOT
          export PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH
          RC=0
          echo no | avdmanager -v create avd -n "$AVD_NAME" -k "system-images;android-$API;google_apis;$ABI" -d pixel_5 --force >> "dyn/$TS/avd.log" 2>&1 || RC=$?
          if [ $RC -ne 0 ]; then
            echo "pixel_5 设备描述无效，回退默认设备" >> "dyn/$TS/run.log"
            echo no | avdmanager -v create avd -n "$AVD_NAME" -k "system-images;android-$API;google_apis;$ABI" --force >> "dyn/$TS/avd.log" 2>&1 || { /tmp/hb.sh "$TS" avd-create-failed; exit 1; }
          fi
          INI=$(find "$HOME" -maxdepth 4 -name "$AVD_NAME.ini" 2>/dev/null | head -1)
          echo "ini=$INI" >> "dyn/$TS/run.log"
          [ -n "$INI" ] || { find "$HOME/.android" "$HOME/.config" -maxdepth 5 2>/dev/null >> "dyn/$TS/avd.log"; /tmp/hb.sh "$TS" avd-ini-missing; exit 1; }
          AVD_HOME=$(dirname "$INI")
          echo "AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          ls -la "$AVD_HOME/$AVD_NAME.avd" >> "dyn/$TS/run.log" 2>&1 || true
          [ -f "$AVD_HOME/$AVD_NAME.avd/config.ini" ] || { /tmp/hb.sh "$TS" avd-config-missing; exit 1; }
          export ANDROID_AVD_HOME="$AVD_HOME"
          LIST=$(/usr/local/lib/android/sdk/emulator/emulator -list-avds 2>/dev/null)
          echo "list_avds=$LIST" >> "dyn/$TS/run.log"
          echo "$LIST" | grep -qx "$AVD_NAME" || { /tmp/hb.sh "$TS" avd-not-listed; exit 1; }
          /tmp/hb.sh "$TS" avd-ready

      - name: 4. 启动 mitmproxy + 宿主机 tcpdump + 模拟器（存活自检 + 软渲染回退）
        run: |
          export PATH=/usr/local/lib/android/sdk/platform-tools:$PATH
          export ANDROID_AVD_HOME="$AVD_HOME"
          # 4a. mitmdump 先行（实时落盘 addon），等 CA 生成
          cat > /tmp/dump_flows.py <<'PY'
          import json
          from mitmproxy import http
          OUT = "/tmp/api-bodies-live.jsonl"
          def response(flow: http.HTTPFlow):
              try:
                  rec = {
                      "method": flow.request.method,
                      "url": flow.request.pretty_url,
                      "status": flow.response.status_code,
                      "resp_ct": flow.response.headers.get("content-type", ""),
                      "req_body": (flow.request.get_text(strict=False) or "")[:20000],
                      "resp_body": (flow.response.get_text(strict=False) or "")[:64000],
                  }
                  with open(OUT, "a") as f:
                      f.write(json.dumps(rec, ensure_ascii=False, default=str) + "\n")
              except Exception as e:
                  with open(OUT, "a") as f:
                      f.write(json.dumps({"err": str(e)}, default=str) + "\n")
          PY
          nohup "$MITM_BIN" --listen-host 0.0.0.0 --listen-port 8080 \
            -w "dyn/$TS/mitm.flows" --set block_global=false --set flow_detail=1 \
            -s /tmp/dump_flows.py \
            > "dyn/$TS/mitm.log" 2>&1 &
          echo $! > /tmp/mitm.pid
          CA_OK=0
          for i in $(seq 1 30); do
            [ -f "$HOME/.mitmproxy/mitmproxy-ca-cert.pem" ] && CA_OK=1 && break
            sleep 1
          done
          echo "mitm_ca_ready=$CA_OK" >> "dyn/$TS/run.log"
          [ "$CA_OK" = "1" ] || { tail -20 "dyn/$TS/mitm.log" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" mitm-ca-missing; exit 1; }
          kill -0 "$(cat /tmp/mitm.pid)" 2>/dev/null || { tail -20 "dyn/$TS/mitm.log" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" mitmdump-died; exit 1; }
          echo "mitm_pid=$(cat /tmp/mitm.pid)" >> "dyn/$TS/run.log"
          # 4b. 宿主机 tcpdump 全量抓包（排除 ssh 与 mdns 噪音）
          if command -v tcpdump >/dev/null && sudo -n true 2>/dev/null; then
            sudo nohup tcpdump -i any -U -s0 -w "$PWD/dyn/$TS/host.pcap" 'not port 22 and not udp port 5353' \
              > /tmp/tcpdump.log 2>&1 &
            sleep 3
            pgrep -f 'tcpdump.*host.pcap' >/dev/null && echo "host_tcpdump=running" >> "dyn/$TS/run.log" || echo "host_tcpdump=failed" >> "dyn/$TS/run.log"
          else
            echo "host_tcpdump=skipped" >> "dyn/$TS/run.log"
          fi
          # 4c. 模拟器（含 -writable-system 与 -http-proxy）
          EMU=/usr/local/lib/android/sdk/emulator/emulator
          OPTS="-avd $AVD_NAME -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none -writable-system -http-proxy http://127.0.0.1:8080 -tcpdump dyn/$TS/net.pcap"
          start_emu() { nohup $EMU $OPTS "$@" > "dyn/$TS/emulator.log" 2>&1 & echo $!; }
          EMU_PID=$(start_emu -accel on)
          sleep 20
          if ! kill -0 "$EMU_PID" 2>/dev/null; then
            echo "accel=on 启动失败，回退 accel=off" >> "dyn/$TS/run.log"
            tail -40 "dyn/$TS/emulator.log" >> "dyn/$TS/run.log" 2>/dev/null || true
            rm -f "dyn/$TS/net.pcap"
            EMU_PID=$(start_emu -accel off)
            sleep 20
            kill -0 "$EMU_PID" 2>/dev/null || { tail -40 "dyn/$TS/emulator.log" >> "dyn/$TS/run.log" 2>/dev/null || true; /tmp/hb.sh "$TS" emulator-died; exit 1; }
            echo "ACCEL=off" >> "$GITHUB_ENV"
          else
            echo "ACCEL=on" >> "$GITHUB_ENV"
          fi
          echo "emu_pid=$EMU_PID" >> "dyn/$TS/run.log"
          echo "EMU_PID=$EMU_PID" >> "$GITHUB_ENV"
          sleep 10
          kill -0 "$EMU_PID" 2>/dev/null || { tail -40 "dyn/$TS/emulator.log" >> "dyn/$TS/run.log" 2>/dev/null || true; /tmp/hb.sh "$TS" emulator-died-late; exit 1; }
          adb start-server >> "dyn/$TS/run.log" 2>&1 || true
          /tmp/hb.sh "$TS" emulator-up

      - name: 5. 等待开机（上限 10 分钟，无挂死）
        run: |
          export PATH=/usr/local/lib/android/sdk/platform-tools:$PATH
          export ANDROID_AVD_HOME="$AVD_HOME"
          command -v adb >/dev/null || { echo "adb 不在 PATH" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" adb-missing; exit 1; }
          BOOTED=0
          for i in $(seq 1 60); do
            B=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOTED=1; echo "boot_ok_loop=$i" >> "dyn/$TS/run.log"; break; fi
            kill -0 "$EMU_PID" 2>/dev/null || { echo "模拟器进程退出 loop=$i" >> "dyn/$TS/run.log"; tail -40 "dyn/$TS/emulator.log" >> "dyn/$TS/run.log" 2>/dev/null || true; /tmp/hb.sh "$TS" emulator-died-boot; exit 1; }
            if [ $((i % 6)) -eq 0 ]; then /tmp/hb.sh "$TS" wait-boot-$i; fi
            sleep 10
          done
          [ "$BOOTED" = "1" ] || { echo "boot 超时" >> "dyn/$TS/run.log"; tail -60 "dyn/$TS/emulator.log" >> "dyn/$TS/run.log" 2>/dev/null || true; adb devices >> "dyn/$TS/run.log" 2>&1 || true; /tmp/hb.sh "$TS" boot-timeout; exit 1; }
          timeout 60 adb shell settings put global window_animation_scale 0 || true
          timeout 60 adb shell settings put global transition_animation_scale 0 || true
          timeout 60 adb shell settings put global animator_duration_scale 0 || true
          /tmp/hb.sh "$TS" boot-ok

      - name: 5b. 注入 mitmproxy 系统 CA（失败不阻断）
        run: |
          export PATH=/usr/local/lib/android/sdk/platform-tools:$PATH
          export ANDROID_AVD_HOME="$AVD_HOME"
          CA="$HOME/.mitmproxy/mitmproxy-ca-cert.pem"
          HASH=$(openssl x509 -in "$CA" -noout -subject_hash_old 2>/dev/null || echo none)
          echo "ca_hash=$HASH" >> "dyn/$TS/run.log"
          [ "$HASH" != "none" ] || { /tmp/hb.sh "$TS" ca-hash-failed; exit 0; }
          cp "$CA" "/tmp/$HASH.0"
          openssl x509 -in "$CA" -text -noout >> "/tmp/$HASH.0" 2>/dev/null || true
          timeout 60 adb root >> "dyn/$TS/run.log" 2>&1 || true
          sleep 5
          timeout 60 adb shell avbctl disable-verity >> "dyn/$TS/run.log" 2>&1 || echo "avbctl 不可用" >> "dyn/$TS/run.log"
          timeout 60 adb disable-verity >> "dyn/$TS/run.log" 2>&1 || true
          sleep 3
          timeout 60 adb reboot >> "dyn/$TS/run.log" 2>&1 || true
          BOOTED=0
          for i in $(seq 1 40); do
            sleep 10
            B=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOTED=1; echo "reboot_ok_loop=$i" >> "dyn/$TS/run.log"; break; fi
          done
          [ "$BOOTED" = "1" ] || { echo "verity 重启后未回正" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" ca-reboot-timeout; exit 0; }
          timeout 60 adb root >> "dyn/$TS/run.log" 2>&1 || true
          sleep 5
          timeout 60 adb remount >> "dyn/$TS/run.log" 2>&1 || { echo "remount 失败，放弃 CA 注入" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" ca-remount-failed; exit 0; }
          timeout 60 adb push "/tmp/$HASH.0" "/system/etc/security/cacerts/$HASH.0" >> "dyn/$TS/run.log" 2>&1 \
            || { echo "CA push 失败" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" ca-push-failed; exit 0; }
          timeout 30 adb shell "chmod 644 /system/etc/security/cacerts/$HASH.0" >> "dyn/$TS/run.log" 2>&1 || true
          timeout 30 adb shell "ls -la /system/etc/security/cacerts/$HASH.0" >> "dyn/$TS/run.log" 2>&1 || true
          /tmp/hb.sh "$TS" ca-push-ok

      - name: 6. 安装 APK 并启动 App
        run: |
          export PATH=/usr/local/lib/android/sdk/platform-tools:$PATH
          export ANDROID_AVD_HOME="$AVD_HOME"
          RC=0
          timeout 300 adb install -r -t -g /tmp/app.apk > "dyn/$TS/install.log" 2>&1 || RC=$?
          echo "install_exit=$RC" >> "dyn/$TS/run.log"
          [ $RC -eq 0 ] || { tail -20 "dyn/$TS/install.log" >> "dyn/$TS/run.log"; /tmp/hb.sh "$TS" install-failed; exit 1; }
          timeout 60 adb shell pm list packages 2>/dev/null | grep -F "$PKG" >> "dyn/$TS/run.log" 2>/dev/null || true
          MAIN_ACT=$(timeout 30 adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$PKG" 2>/dev/null | tail -1 | tr -d '\r')
          echo "main_act=$MAIN_ACT" >> "dyn/$TS/run.log"
          RC=0
          if [ -n "$MAIN_ACT" ]; then
            timeout 60 adb shell am start -n "$MAIN_ACT" >> "dyn/$TS/run.log" 2>&1 || RC=$?
          else
            timeout 60 adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >> "dyn/$TS/run.log" 2>&1 || RC=$?
          fi
          echo "launch_exit=$RC" >> "dyn/$TS/run.log"
          sleep 20
          timeout 30 adb exec-out screencap -p > "dyn/$TS/screen-20s.png" 2>/dev/null || true
          timeout 60 adb shell dumpsys activity activities 2>/dev/null | head -80 > "dyn/$TS/activity-top.txt" || true
          /tmp/hb.sh "$TS" installed-launched

      - name: 7. 运行观测（截屏 + 交互 + 心跳）
        run: |
          export PATH=/usr/local/lib/android/sdk/platform-tools:$PATH
          export ANDROID_AVD_HOME="$AVD_HOME"
          if [ -z "$DUR" ]; then DUR=12; fi
          [ "$DUR" -ge 5 ] || DUR=5
          [ "$DUR" -le 20 ] || DUR=20
          echo "observe_minutes=$DUR" >> "dyn/$TS/run.log"
          for i in $(seq 1 "$DUR"); do
            if [ "$i" = "2" ]; then
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-before.png" 2>/dev/null || true
              timeout 20 adb shell input tap 925 715 || true; sleep 6
              timeout 20 adb shell input tap 925 715 || true; sleep 6
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-modal.png" 2>/dev/null || true
              echo "interact=modal-dismiss done" >> "dyn/$TS/run.log"
            fi
            if [ "$i" = "4" ]; then
              timeout 20 adb shell input tap 270 700 || true
              sleep 25
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-detail1.png" 2>/dev/null || true
              timeout 20 adb shell input tap 700 2150 || true
              sleep 15
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-loginpage.png" 2>/dev/null || true
              timeout 20 adb shell input tap 450 730 || true; sleep 4
              timeout 20 adb shell input text "928081274@qq.com" || true; sleep 3
              timeout 20 adb shell input keyevent 111 || true; sleep 2
              timeout 20 adb shell input tap 78 1015 || true; sleep 2
              timeout 20 adb shell input tap 450 890 || true; sleep 4
              timeout 20 adb shell input text "Zmh20100227" || true; sleep 3
              timeout 20 adb shell input keyevent 111 || true; sleep 2
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-loginfilled.png" 2>/dev/null || true
              timeout 20 adb shell input tap 540 1212 || true
              sleep 18
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-loggedin.png" 2>/dev/null || true
              echo "interact=login done" >> "dyn/$TS/run.log"
            fi
            if [ "$i" = "5" ]; then
              echo "" | base64 -d > /tmp/forge.py && python3 /tmp/forge.py >> "dyn/$TS/run.log" 2>&1 || true
              timeout 30 adb exec-out screencap -p > /tmp/chk.png 2>/dev/null || true
              python3 -m pip install -q pillow 2>/dev/null || true
              python3 -c "from PIL import Image; im=Image.open('/tmp/chk.png').convert('RGB'); w,h=im.size; px=im.getpixel((w//2,int(1212*h//2340))); print('login_check px=%s'%(px,)); open('/tmp/ABORT','w').write('1') if (px[0]>200 and px[1]>150 and px[2]<130 and px[0]-px[2]>80) else print('login_passed')" >> "dyn/$TS/run.log" 2>&1 || true
            fi
            if [ -f /tmp/ABORT ] && [ "$i" -lt "$DUR" ]; then
              echo "fast-fail: 登录未成功，提前中止于 i=$i" >> "dyn/$TS/run.log"
              /tmp/hb.sh "$TS" fastfail-login-$i || true
              break
            fi
            if [ "$i" = "6" ]; then
              timeout 20 adb shell input keyevent 4 || true; sleep 3
              timeout 20 adb shell input keyevent 4 || true; sleep 3
              timeout 20 adb shell input tap 270 700 || true
              sleep 20
              timeout 20 adb shell input tap 700 2150 || true
              sleep 15
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-page0.png" 2>/dev/null || true
              timeout 20 adb shell input swipe 540 1800 540 600 400 || true; sleep 8
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-page1.png" 2>/dev/null || true
              timeout 20 adb shell input swipe 540 1800 540 600 400 || true; sleep 8
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-page2.png" 2>/dev/null || true
              timeout 20 adb shell input swipe 540 1800 540 600 400 || true; sleep 8
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-page3.png" 2>/dev/null || true
              echo "interact=read done" >> "dyn/$TS/run.log"
            fi
            if [ "$i" = "8" ]; then
              timeout 20 adb shell input keyevent 4 || true; sleep 3
              timeout 20 adb shell input tap 810 700 || true
              sleep 20
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-detail2.png" 2>/dev/null || true
              timeout 20 adb shell input tap 700 2150 || true
              sleep 15
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-page0b.png" 2>/dev/null || true
              timeout 20 adb shell input swipe 540 1800 540 600 400 || true; sleep 8
              timeout 30 adb exec-out screencap -p > "dyn/$TS/inter-page1b.png" 2>/dev/null || true
              echo "interact=detail2 done" >> "dyn/$TS/run.log"
            fi
            sleep 40
            timeout 30 adb exec-out screencap -p > "dyn/$TS/screen-${i}m.png" 2>/dev/null || true
            timeout 30 adb shell input swipe 540 1500 540 500 300 >> "dyn/$TS/run.log" 2>&1 || true
            kill -0 "$(cat /tmp/mitm.pid)" 2>/dev/null || echo "warn: mitmdump 进程消失 minute=$i" >> "dyn/$TS/run.log"
            if [ $((i % 3)) -eq 0 ]; then /tmp/hb.sh "$TS" tick-${i}m; fi
          done
          timeout 60 adb logcat -d -v threadtime > "dyn/$TS/logcat.txt" 2>&1 || true
          echo "logcat_lines=$(wc -l < dyn/$TS/logcat.txt 2>/dev/null || echo 0)" >> "dyn/$TS/run.log"
          /tmp/hb.sh "$TS" observe-done

      - name: 8. 抓取 App 数据目录
        run: |
          export PATH=/usr/local/lib/android/sdk/platform-tools:$PATH
          export ANDROID_AVD_HOME="$AVD_HOME"
          timeout 60 adb root >> "dyn/$TS/run.log" 2>&1 || true
          sleep 5
          timeout 60 adb shell "ls -la /data/data/$PKG" > "dyn/$TS/datadir-ls.txt" 2>&1 || true
          timeout 120 adb shell "find /data/data/$PKG -type f | head -500" > "dyn/$TS/files.txt" 2>&1 || true
          timeout 300 adb shell "tar -c /data/data/$PKG" > "dyn/$TS/datadir.tar" 2>/dev/null || true
          echo "tar_bytes=$(stat -c%s dyn/$TS/datadir.tar 2>/dev/null || echo 0)" >> "dyn/$TS/run.log"
          /tmp/hb.sh "$TS" datadir-done

      - name: 9. 停止抓包与模拟器，解析全部流量
        run: |
          export PATH=/usr/local/lib/android/sdk/platform-tools:$PATH
          export ANDROID_AVD_HOME="$AVD_HOME"
          timeout 30 adb emu kill >> "dyn/$TS/run.log" 2>&1 || true
          sleep 8
          kill "$EMU_PID" 2>/dev/null || true
          sleep 5
          kill -9 "$EMU_PID" 2>/dev/null || true
          sudo pkill -f 'tcpdump.*host.pcap' 2>/dev/null || true
          sleep 3
          sudo chown -R "$USER:$USER" "dyn/$TS" 2>/dev/null || true
          echo "pcap_bytes=$(stat -c%s dyn/$TS/net.pcap 2>/dev/null || echo 0)" >> "dyn/$TS/run.log"
          echo "host_pcap_bytes=$(stat -c%s dyn/$TS/host.pcap 2>/dev/null || echo 0)" >> "dyn/$TS/run.log"
          echo "flows_bytes=$(stat -c%s dyn/$TS/mitm.flows 2>/dev/null || echo 0)" >> "dyn/$TS/run.log"
          kill "$(cat /tmp/mitm.pid)" 2>/dev/null || true
          sleep 3
          if [ -s "dyn/$TS/host.pcap" ]; then
            tshark -r "dyn/$TS/host.pcap" -Y 'dns.flags.response==0' -T fields -e dns.qry.name 2>/dev/null | sort | uniq -c | sort -rn > "dyn/$TS/dns.txt"
            tshark -r "dyn/$TS/host.pcap" -Y 'tls.handshake.type==1' -T fields -e tls.handshake.extensions_server_name 2>/dev/null | sort | uniq -c | sort -rn > "dyn/$TS/sni.txt"
            tshark -r "dyn/$TS/host.pcap" -Y 'quic' -T fields -e quic.server_name 2>/dev/null | sort | uniq -c | sort -rn > "dyn/$TS/quic-sni.txt"
            echo "dns_hosts=$(wc -l < dyn/$TS/dns.txt) sni_hosts=$(wc -l < dyn/$TS/sni.txt) quic=$(wc -l < dyn/$TS/quic-sni.txt)" >> "dyn/$TS/run.log"
          else
            echo "host.pcap 缺失" >> "dyn/$TS/run.log"
          fi
          cp /tmp/api-bodies-live.jsonl "dyn/$TS/api-flows.jsonl" 2>/dev/null || true
          echo "api_flows=$(wc -l < dyn/$TS/api-flows.jsonl 2>/dev/null || echo 0)" >> "dyn/$TS/run.log"
          grep -aE '^(GET|POST|CONNECT|PUT|HEAD)|client connect|server connect|error|TLS' "dyn/$TS/mitm.log" 2>/dev/null | head -400 > "dyn/$TS/mitm-conn.txt" || true
          if [ -s "dyn/$TS/net.pcap" ]; then
            tshark -r "dyn/$TS/net.pcap" -Y 'tls.handshake.type==1' -T fields -e tls.handshake.extensions_server_name 2>/dev/null | sort | uniq -c | sort -rn > "dyn/$TS/guest-sni.txt" || true
          fi
          API_N=$( [ -f "dyn/$TS/api-flows.jsonl" ] && wc -l < "dyn/$TS/api-flows.jsonl" || echo 0)
          DNSN=$( [ -f "dyn/$TS/dns.txt" ] && wc -l < "dyn/$TS/dns.txt" || echo 0)
          SNIN=$( [ -f "dyn/$TS/sni.txt" ] && wc -l < "dyn/$TS/sni.txt" || echo 0)
          {
            echo "## 动态探针 v3 $TS"
            echo "- 分支: $BR；渲染: $ACCEL；观测: $DUR 分钟（含交互）"
            echo "- API 明文流: $API_N；DNS host: $DNSN；SNI host: $SNIN"
            echo "- host.pcap: $(stat -c%s dyn/$TS/host.pcap 2>/dev/null || echo 0) B；flows: $(stat -c%s dyn/$TS/mitm.flows 2>/dev/null || echo 0) B"
          } > "dyn/$TS/summary.md"
          /tmp/hb.sh "$TS" parsed

      - name: 10. 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyn-${{ env.TS }}
          path: dyn/
          if-no-files-found: warn
          retention-days: 7

      - name: 11. Job Summary
        if: always()
        run: |
          {
            echo "### 动态探针 v3 $TS"
            echo ""
            echo "结果分支: **$BR**"
            echo ""
            cat "dyn/$TS/summary.md" 2>/dev/null || true
            echo ""
            echo "**API 域名 Top 30**"
            echo '```'
            grep -o '"url":"[^"]*"' "dyn/$TS/api-flows.jsonl" 2>/dev/null | sed 's/"url":"https\?:\/\///;s/\/.*//' | sort | uniq -c | sort -rn | head -30
            echo '```'
            echo ""
            echo "**SNI Top 30**"
            echo '```'
            head -30 "dyn/$TS/sni.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          /tmp/hb.sh -a "$TS" end
