name: RE-APK 动态探针

# 在 GitHub runner 的 KVM 上跑 x86_64 模拟器，真实启动 APK：
# 1) 宿主机侧 tcpdump 拓 DNS 与 TLS SNI（不破证书也能看到连接哪些域名）
# 2) root 拉 /data/data/com.hbsclj.uth，拿本地配置、缓存、热更新包
# 3) frida 拦 open() 记载文件访问路径

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dynamic-probe.yml'

permissions:
  contents: write

env:
  PKG: com.hbsclj.uth
  APK_URL: 'https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTY1MTEyMTU0NzpNRVJDSEFOVDpbQkA3MzE3MjYyZToyNDE5OTczMjAyMzU0Nw%3D%3D.apk'

jobs:
  dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: KVM 与 SDK 自检
        run: |
          ls -l /dev/kvm || echo 'NO KVM'
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head

      - name: 下载 APK
        run: |
          mkdir -p dyn
          curl -fsSL --retry 3 --max-time 900 -o dyn/app.apk "$APK_URL"
          sha256sum dyn/app.apk | tee dyn/sha256.txt
          unzip -l dyn/app.apk | grep -E 'lib/(x86_64|arm64-v8a)/libapp.so' || true

      - name: 建 AVD 并启动模拟器
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64" > dyn/sdk.log 2>&1
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n probe -k "system-images;android-33;google_apis;x86_64" -d pixel_5 --force
          echo 'hw.ramSize=3072' >> ~/.android/avd/probe.avd/config.ini
          nohup "$ANDROID_HOME/emulator/emulator" -avd probe -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on -no-snapshot > dyn/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 60); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && echo "boot ok after ${i}0s" && break
            sleep 10
          done
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abi

      - name: 装包 + 启动 + 抓网络
        run: |
          adb root || true
          sleep 5
          adb install -r dyn/app.apk | tail -2
          adb shell pm grant "$PKG" android.permission.READ_PHONE_STATE 2>/dev/null || true
          adb shell pm grant "$PKG" android.permission.ACCESS_FINE_LOCATION 2>/dev/null || true
          sudo timeout 120 tcpdump -i any -s 0 -n "port 53 or port 443" > dyn/net.txt 2>dyn/net.err &
          adb shell am start -n "$PKG/.MainActivity" | tail -2
          sleep 100
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | head -3 || true
          adb logcat -d -v time > dyn/logcat.txt 2>&1 || true
          sudo pkill tcpdump || true
          echo '--- 连接到的域名（DNS/SNI）---'
          grep -oE 'A\? [a-z0-9.-]+\.(com|cn|lat|io|net)' dyn/net.txt | sort | uniq -c | sort -rn | head -30 || true
          grep -oE '\|\| [a-z0-9.-]+\.(com|cn|lat|io|net)' dyn/net.txt | sort | uniq -c | sort -rn | head -30 || true

      - name: 拉取应用数据目录
        run: |
          adb root || true
          sleep 3
          adb shell "ls -R /data/data/$PKG 2>/dev/null | head -200" > dyn/datadir-ls.txt || true
          adb shell "tar -c /data/data/$PKG 2>/dev/null" > dyn/datadir.tar || true
          tar -tf dyn/datadir.tar 2>/dev/null | head -60 || echo 'tar 读取失败'
          mkdir -p dyn/pulled && tar -xf dyn/datadir.tar -C dyn/pulled 2>/dev/null || true
          du -sh dyn/pulled 2>/dev/null || true
          find dyn/pulled -type f -size -2M 2>/dev/null | head -60

      - name: frida 拦 open 记载文件路径
        continue-on-error: true
        run: |
          pip3 install --break-system-packages -q frida-tools || true
          V=$(python3 -c 'import frida;print(frida.__version__)')
          echo "frida $V"
          curl -fsSL --retry 3 -o /tmp/fs.xz "https://github.com/frida/frida/releases/download/${V}/frida-server-${V}-android-x86_64.xz"
          unxz -f /tmp/fs.xz
          adb push /tmp/fs /data/local/tmp/fs > /dev/null
          adb shell "chmod 755 /data/local/tmp/fs"
          nohup adb shell "/data/local/tmp/fs" > dyn/frida-server.log 2>&1 &
          sleep 8
          cat > dyn/hook.js <<'EOF'
          var m = Process.getModuleByName('libc.so');
          var open = m.findExportByName('open');
          Interceptor.attach(open, {
            onEnter: function (a) {
              try {
                var p = a[0].readUtf8String();
                if (p && p.indexOf('/data/data/com.hbsclj.uth') === 0) send({ p: p });
              } catch (e) {}
            }
          });
          console.log('hook installed');
          EOF
          timeout 90 frida -U -f "$PKG" -s dyn/hook.js --no-pause > dyn/frida.log 2>&1 || true
          head -40 dyn/frida.log || true

      - name: 提交结果到分支
        if: always()
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          DEST="dyn/$TS"
          mkdir -p "$DEST"
          cp dyn/net.txt dyn/logcat.txt dyn/datadir-ls.txt "$DEST/" 2>/dev/null || true
          cp dyn/frida.log "$DEST/" 2>/dev/null || true
          tar -cf "$DEST/datadir.tar" -C dyn pulled 2>/dev/null || true
          git config user.name 're-bot'
          git config user.email 're-bot@users.noreply.github.com'
          git checkout -B "re/dyn-${TS}"
          git add "$DEST"
          git commit -m "re: 动态探针 $TS" || echo '无变更'
          git push --force origin "re/dyn-${TS}"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyn-probe-${{ github.run_number }}
          path: dyn/
          retention-days: 14
