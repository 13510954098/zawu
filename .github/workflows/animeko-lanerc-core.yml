name: Animeko Lanerc Kotlin core checks
on:
  push:
    branches: [arena/44f5d2ee-zawu]
    paths: [integration/animeko/**, scripts/prepare_animeko_lanerc.py, tests/test_animeko_prepare.py, .github/workflows/animeko-lanerc-core.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kotlin-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/44f5d2ee-zawu
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate reproducible source preparation
        run: |
          python -m unittest discover -s tests -p "test_animeko*.py" -v
          python scripts/prepare_animeko_lanerc.py
      - name: Compile Kotlin protocol and parallel search with public fixtures only
        working-directory: integration/animeko/core-checks
        run: bash gradlew test --no-daemon --stacktrace
      - name: Record exact verification scope
        run: |
          python - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in pathlib.Path('integration/animeko/core-checks/build/test-results/test').glob('TEST-*.xml')]
          assert suites
          counts = {key: sum(int(s.attrib.get(key, 0)) for s in suites) for key in ['tests','failures','errors','skipped']}
          assert counts['tests'] > 0 and counts['failures'] == counts['errors'] == counts['skipped'] == 0
          report = {'scope':'Kotlin JVM core compiled and tested against public Dart fixtures and synthetic statically anchored API/community DTOs; no production responses', **counts, 'android_app_built_by_this_check':False, 'animeko_ui_compiled_by_this_check':False, 'original_source_import_verified':False, 'production_requests_performed':False, 'pinned_upstream_source_materialized':True, 'source_preparation_security_tests':4}
          pathlib.Path('analysis/lanerc/animeko-core-validation.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/lanerc/animeko-core-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record compiled Kotlin Lanerc protocol and parallel search checks'
          git pull --rebase origin arena/44f5d2ee-zawu
          git push origin HEAD:arena/44f5d2ee-zawu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animeko-lanerc-kotlin-test-reports
          path: integration/animeko/core-checks/build/reports/tests/test
