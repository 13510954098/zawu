name: Fetch Lanerc official download
on:
  workflow_dispatch:
  push:
    branches: [arena/44f5d2ee-zawu]
    paths: [.github/workflows/lanerc-fetch.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch homepage and directly linked APKs
        shell: python
        run: |
          import hashlib, json, pathlib, re, urllib.parse, urllib.request
          out = pathlib.Path('lanerc-download')
          out.mkdir()
          def download(url, limit):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  data = response.read(limit + 1)
                  if len(data) > limit:
                      raise ValueError('Download exceeds size limit')
                  return data, response.url
          page, final_url = download('https://lanerc.app/', 5 * 1024 * 1024)
          (out / 'homepage.html').write_bytes(page)
          text = page.decode('utf-8', errors='replace')
          candidates = re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, re.I)
          candidates += re.findall(r'''https?://[^\s"'<>]+''', text)
          urls = sorted({urllib.parse.urljoin(final_url, u.replace('&amp;', '&')) for u in candidates if '.apk' in u.lower()})
          report = {'homepage': final_url, 'apk_candidates': urls, 'downloads': []}
          for i, url in enumerate(urls[:3], 1):
              if urllib.parse.urlparse(url).scheme not in ('https', 'http'):
                  continue
              data, resolved = download(url, 300 * 1024 * 1024)
              if not data.startswith(b'PK'):
                  raise ValueError('Linked download is not a ZIP/APK file')
              name = f'lanerc-official-{i}.apk'
              (out / name).write_bytes(data)
              report['downloads'].append({'file': name, 'url': resolved, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          (out / 'download-report.json').write_text(json.dumps(report, indent=2))
      - name: Upload downloads for analysis
        uses: actions/upload-artifact@v4
        with:
          name: lanerc-official-download
          path: lanerc-download/
          retention-days: 3
