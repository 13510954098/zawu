name: Fetch supplied Lanerc APK
on:
  workflow_dispatch:
  push:
    branches: [arena/44f5d2ee-zawu]
    paths: [.github/workflows/lanerc-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/44f5d2ee-zawu
      - name: Retrieve already downloaded APK
        uses: actions/download-artifact@v4
        with:
          name: lanerc-official-download
          path: downloads/lanerc/
          run-id: 42435691449
          github-token: ${{ github.token }}
      - name: Handle GitHub single-file size limit
        run: |
          python - <<'PYTHON'
          import pathlib
          for path in pathlib.Path('downloads/lanerc').glob('*.apk'):
              if path.stat().st_size >= 100 * 1024 * 1024:
                  with path.open('rb') as src:
                      index = 1
                      while chunk := src.read(50 * 1024 * 1024):
                          path.with_name(path.name + f'.part{index:02d}').write_bytes(chunk)
                          index += 1
                  path.unlink()
                  pathlib.Path('downloads/lanerc/README.md').write_text(
                      'APK split to meet GitHub single-file limits. Reassemble with:\n\n'
                      '```sh\ncat *.apk.part* > lanerc-supplied.apk\n```\n'
                      'Verify SHA-256 against download-report.json. Publisher unverified.\n')
          PYTHON
      - name: Commit APK and report to current session branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/lanerc/
          if git diff --cached --quiet; then
            echo "Download unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Store user-supplied Lanerc APK and download checksum"
          git push origin HEAD:arena/44f5d2ee-zawu
