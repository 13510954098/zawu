name: Animeko Lanerc fresh install and startup smoke
on:
  push:
    branches: [arena/44f5d2ee-zawu]
    paths: [.github/workflows/animeko-lanerc-smoke.yml, scripts/animeko_android_smoke.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: animeko-lanerc-app-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare pinned Android host for emulator ABI
        run: |
          python scripts/prepare_animeko_lanerc.py
          cat >> .local/animeko/worktree/local.properties <<'EOF'
          ani.enable.firebase=false
          ani.enable.ios=false
          ani.android.abis=x86_64
          jvm.toolchain.version=21
          jvm.toolchain.vendor=Eclipse Adoptium
          EOF
          sudo chmod 666 /dev/kvm
      - name: Build x86_64 APK before starting emulator
        working-directory: .local/animeko/worktree
        run: |
          set +e
          bash gradlew :app:android:assembleDefaultDebug --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx5g > /tmp/lanerc-app-smoke-build.log 2>&1
          status=$?
          tail -80 /tmp/lanerc-app-smoke-build.log
          exit "$status"
      - name: Fresh install and launch without credentials
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -camera-front none -memory 1536
          script: python scripts/animeko_android_smoke.py
      - name: Preserve exact smoke scope and public diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          result = pathlib.Path('/tmp/lanerc-app-smoke/validation.json')
          output = pathlib.Path('analysis/lanerc/animeko-app-smoke-validation.json')
          if result.exists(): shutil.copyfile(result, output)
          else: output.write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'], 'scope':'Fresh-install/startup smoke did not reach device verification', 'install_verified':False, 'launch_verified':False}, indent=2)+'\n')
          log = pathlib.Path('/tmp/lanerc-app-smoke-build.log')
          if log.exists(): pathlib.Path('analysis/lanerc/animeko-app-smoke-diagnostic.txt').write_text('\n'.join(log.read_text(errors='replace').splitlines()[-80:])+'\n')
          PY
          git switch -C arena/44f5d2ee-zawu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/lanerc/animeko-app-smoke-*.json
          if test -f analysis/lanerc/animeko-app-smoke-diagnostic.txt; then git add analysis/lanerc/animeko-app-smoke-diagnostic.txt; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Record actual fresh-install and startup smoke outcome without claiming playback'
          git pull --rebase -X theirs origin arena/44f5d2ee-zawu
          git push origin HEAD:arena/44f5d2ee-zawu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animeko-lanerc-startup-smoke-evidence
          path: /tmp/lanerc-app-smoke/
          if-no-files-found: warn
